<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SHOWROOM The Twins — Punto de Venta</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap");
    body { font-family: "Inter", sans-serif; }
    @media print {
      @page { size: 58mm auto; margin: 0; }
      body * { visibility: hidden !important; }
      #thermal-receipt-58mm, #thermal-receipt-58mm * { visibility: visible !important; }
      #thermal-receipt-58mm {
        position: fixed !important;
        left: 0 !important;
        top: 0 !important;
        width: 58mm !important;
        padding: 3mm 2.5mm !important;
        margin: 0 !important;
        background: #fff !important;
        color: #000 !important;
        font-family: "Courier New", Courier, monospace !important;
        font-size: 11px !important;
        line-height: 1.25 !important;
      }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen">
  <div id="app"></div>
  <div id="thermal-receipt-58mm" class="hidden print:block"></div>

  <script>
    var STORAGE_KEY = "the_twins_pos_v5";

    var DEFAULT_STATE = {
      role: "seller",
      adminPassword: "twins2026",
      showAuthModal: false,
      showChangePassModal: false,
      authError: "",
      pendingTab: null,
      reinvestPercent: 50,
      cashOpen: true,
      openingFund: 500,
      cashMovements: [],
      activeTab: "pos",
      selectedCategory: "Todos",
      searchQuery: "",
      serviceType: "Comer aquí",
      selectedTable: "Barra 1",
      paymentMethod: "Efectivo",
      amountPaid: "",
      orderNote: "",
      cart: [],
      lastTicket: null,
      printerStatus: "Lista para MP58C6",
      products: [
        { id: "P1", name: "Banderillas", category: "Antojitos", costPrice: 28, price: 65, stock: 30, infinite: false, desc: "Crujientes con aderezos" },
        { id: "P2", name: "Orden de Papas", category: "Snacks", costPrice: 20, price: 50, stock: 40, infinite: false, desc: "Papas a la francesa doradas" },
        { id: "P3", name: "Ramen", category: "Especiales", costPrice: 38, price: 85, stock: 20, infinite: false, desc: "Caldo preparado con huevo y cebollín" },
        { id: "P4", name: "Marquesitas", category: "Postres", costPrice: 12, price: 30, stock: 35, infinite: false, desc: "Crujiente rellena tradicional" },
        { id: "P5", name: "Hamburguesas (Arrachera y Sirloin)", category: "Platillos", costPrice: 45, price: 90, stock: 25, infinite: false, desc: "Carne de arrachera y sirloin" },
        { id: "P6", name: "Orden de Alitas", category: "Platillos", costPrice: 46, price: 90, stock: 25, infinite: false, desc: "Incluye papas a la francesa" },
        { id: "P7", name: "Refresco / Bebida", category: "Bebidas", costPrice: 11, price: 25, stock: 0, infinite: true, desc: "Bebida fría" },
        { id: "P8", name: "Extra Queso / Tocino", category: "Extras", costPrice: 8, price: 20, stock: 0, infinite: true, desc: "Complemento adicional" }
      ],
      tables: [
        { id: "Barra 1", zone: "Barra", status: "Libre", total: 0 },
        { id: "Barra 2", zone: "Barra", status: "Libre", total: 0 },
        { id: "Mesa 1", zone: "Showroom", status: "Libre", total: 0 },
        { id: "Mesa 2", zone: "Showroom", status: "Libre", total: 0 },
        { id: "Para Llevar", zone: "Express", status: "Libre", total: 0 }
      ],
      orders: [],
      inventoryLogs: [
        {
          date: new Date().toLocaleDateString("es-MX"),
          time: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }),
          action: "Inicio",
          product: "Catálogo inicial",
          detail: "Productos cargados en el sistema",
          user: "Sistema"
        }
      ],
      liveLogs: [
        {
          time: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }),
          msg: "SHOWROOM The Twins POS listo"
        }
      ]
    };

    var state = loadState();
    var btChar = null;

    function loadState() {
      try {
        var raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          var parsed = JSON.parse(raw);
          return Object.assign({}, DEFAULT_STATE, parsed, {
            showAuthModal: false,
            showChangePassModal: false,
            authError: "",
            pendingTab: null,
            cart: parsed.cart || [],
            cashMovements: parsed.cashMovements || [],
            inventoryLogs: parsed.inventoryLogs || DEFAULT_STATE.inventoryLogs,
            liveLogs: parsed.liveLogs || DEFAULT_STATE.liveLogs
          });
        }
      } catch (err) {}
      return JSON.parse(JSON.stringify(DEFAULT_STATE));
    }

    function saveState() {
      try {
        var copy = Object.assign({}, state, {
          showAuthModal: false,
          showChangePassModal: false,
          authError: "",
          pendingTab: null
        });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(copy));
      } catch (err) {}
    }

    function fmt(n) {
      return "$" + Number(n || 0).toFixed(2);
    }

    function escAttr(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function addLiveLog(msg) {
      var time = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
      state.liveLogs.unshift({ time: time, msg: msg });
      if (state.liveLogs.length > 50) state.liveLogs.pop();
    }

    function addInvLog(action, product, detail) {
      var now = new Date();
      state.inventoryLogs.unshift({
        date: now.toLocaleDateString("es-MX"),
        time: now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" }),
        action: action,
        product: product,
        detail: detail,
        user: state.role === "admin" ? "Administrador" : "Vendedor"
      });
      if (state.inventoryLogs.length > 120) state.inventoryLogs.pop();
    }

    function getFinancials() {
      var valid = state.orders.filter(function(o) { return o.status !== "Cancelado"; });
      var sales = valid.reduce(function(s, o) { return s + o.totalSale; }, 0);
      var cost = valid.reduce(function(s, o) { return s + o.totalCost; }, 0);
      var grossProfit = sales - cost;
      var reinvest = grossProfit > 0 ? grossProfit * (state.reinvestPercent / 100) : 0;
      var payroll = state.cashMovements
        .filter(function(m) { return m.category === "Sueldos / Nómina"; })
        .reduce(function(s, m) { return s + m.amount; }, 0);
      var expenses = state.cashMovements
        .filter(function(m) { return m.category === "Gasto Operativo / Insumos" || m.category === "Servicios / Renta"; })
        .reduce(function(s, m) { return s + m.amount; }, 0);
      var extraIn = state.cashMovements
        .filter(function(m) { return m.category === "Ingreso Adicional"; })
        .reduce(function(s, m) { return s + m.amount; }, 0);
      var netFinal = grossProfit + extraIn - reinvest - payroll - expenses;
      return {
        count: valid.length,
        sales: sales,
        cost: cost,
        grossProfit: grossProfit,
        reinvest: reinvest,
        payroll: payroll,
        expenses: expenses,
        extraIn: extraIn,
        netFinal: netFinal
      };
    }

    function openAuth(tabKey) {
      state.showAuthModal = true;
      state.authError = "";
      state.pendingTab = tabKey || null;
      render();
      setTimeout(function() {
        var el = document.getElementById("passInput");
        if (el) el.focus();
      }, 40);
    }

    function closeAuth() {
      state.showAuthModal = false;
      state.authError = "";
      state.pendingTab = null;
      render();
    }

    function handleAuthSubmit(e) {
      e.preventDefault();
      var el = document.getElementById("passInput");
      var val = el ? el.value : "";
      if (val === state.adminPassword) {
        state.role = "admin";
        state.showAuthModal = false;
        state.authError = "";
        if (state.pendingTab) {
          state.activeTab = state.pendingTab;
          state.pendingTab = null;
        }
        addLiveLog("Modo Administrador activado");
        saveState();
        render();
      } else {
        state.authError = "Contraseña incorrecta.";
        render();
      }
    }

    function setSellerMode() {
      state.role = "seller";
      if (state.activeTab === "inventory" || state.activeTab === "cash") {
        state.activeTab = "pos";
      }
      addLiveLog("Modo Vendedor activado");
      saveState();
      render();
    }

    function openChangePass() {
      if (state.role !== "admin") return;
      state.showChangePassModal = true;
      state.authError = "";
      render();
    }

    function closeChangePass() {
      state.showChangePassModal = false;
      state.authError = "";
      render();
    }

    function handleChangePass(e) {
      e.preventDefault();
      var f = e.target;
      var cur = f.curPass.value;
      var nw = f.newPass.value.trim();
      var cf = f.confPass.value.trim();
      if (cur !== state.adminPassword) {
        state.authError = "La contraseña actual no es correcta.";
        render();
        return;
      }
      if (nw.length < 4) {
        state.authError = "Usa al menos 4 caracteres.";
        render();
        return;
      }
      if (nw !== cf) {
        state.authError = "Las contraseñas no coinciden.";
        render();
        return;
      }
      state.adminPassword = nw;
      state.showChangePassModal = false;
      state.authError = "";
      addLiveLog("Contraseña de Administrador actualizada");
      saveState();
      render();
      alert("Contraseña actualizada.");
    }

    function goTab(tabKey) {
      if ((tabKey === "inventory" || tabKey === "cash") && state.role !== "admin") {
        openAuth(tabKey);
        return;
      }
      state.activeTab = tabKey;
      saveState();
      render();
    }

    function addCartItem(prodId) {
      var p = state.products.find(function(x) { return x.id === prodId; });
      if (!p) return;
      if (!p.infinite && p.stock <= 0) {
        alert("Producto agotado.");
        return;
      }
      var found = state.cart.find(function(x) { return x.id === prodId; });
      if (found) {
        if (!p.infinite && found.qty + 1 > p.stock) {
          alert("No hay más stock disponible.");
          return;
        }
        found.qty += 1;
      } else {
        state.cart.push({
          id: p.id,
          name: p.name,
          costPrice: Number(p.costPrice),
          price: Number(p.price),
          qty: 1
        });
      }
      saveState();
      render();
    }

    function changeQty(idx, delta) {
      var it = state.cart[idx];
      if (!it) return;
      var p = state.products.find(function(x) { return x.id === it.id; });
      var next = it.qty + delta;
      if (next <= 0) {
        state.cart.splice(idx, 1);
      } else {
        if (p && !p.infinite && next > p.stock) {
          alert("Stock máximo alcanzado.");
          return;
        }
        it.qty = next;
      }
      saveState();
      render();
    }

    function checkoutOrder() {
      if (!state.cashOpen) {
        alert("La caja está cerrada.");
        return;
      }
      if (state.cart.length === 0) return;
      var totalSale = state.cart.reduce(function(s, i) { return s + i.price * i.qty; }, 0);
      var totalCost = state.cart.reduce(function(s, i) { return s + i.costPrice * i.qty; }, 0);
      var paid = state.paymentMethod === "Efectivo" ? (parseFloat(state.amountPaid) || totalSale) : totalSale;
      if (state.paymentMethod === "Efectivo" && paid < totalSale) {
        alert("El monto recibido es menor al total.");
        return;
      }
      var change = state.paymentMethod === "Efectivo" ? Math.max(0, paid - totalSale) : 0;
      var profit = totalSale - totalCost;
      var reinvest = profit > 0 ? profit * (state.reinvestPercent / 100) : 0;
      var folio = 1000 + state.orders.length + 1;

      state.cart.forEach(function(item) {
        var p = state.products.find(function(x) { return x.id === item.id; });
        if (p && !p.infinite) {
          var prev = p.stock;
          p.stock = Math.max(0, p.stock - item.qty);
          addInvLog("Salida por Venta", p.name, "Venta #" + folio + ": -" + item.qty + " (" + prev + " -> " + p.stock + ")");
        }
      });

      var order = {
        id: folio,
        time: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }),
        items: JSON.parse(JSON.stringify(state.cart)),
        serviceType: state.serviceType,
        table: state.selectedTable,
        paymentMethod: state.paymentMethod,
        totalSale: totalSale,
        totalCost: totalCost,
        profit: profit,
        reinvest: reinvest,
        paid: paid,
        change: change,
        note: state.orderNote,
        status: "Preparando"
      };

      state.orders.unshift(order);
      state.lastTicket = order;
      state.cart = [];
      state.amountPaid = "";
      state.orderNote = "";
      addLiveLog("Venta #" + folio + " por " + fmt(totalSale));
      saveState();
      render();
    }

    function getReceiptText(order) {
      var sep = "--------------------------------\n";
      var t = "      SHOWROOM THE TWINS\n";
      t += "  ESPACIO COLABORATIVO EMPREND.\n";
      t += sep;
      t += "Folio: #" + order.id + "  " + order.time + "\n";
      t += "Servicio: " + order.serviceType + " (" + order.table + ")\n";
      t += "Pago: " + order.paymentMethod + "\n";
      t += sep;
      order.items.forEach(function(i) {
        t += i.qty + "x " + i.name.slice(0, 18) + "\n";
        t += "   " + fmt(i.price) + " c/u    " + fmt(i.price * i.qty) + "\n";
      });
      if (order.note) t += "Nota: " + order.note + "\n";
      t += sep;
      t += "TOTAL:            " + fmt(order.totalSale) + "\n";
      if (order.paymentMethod === "Efectivo") {
        t += "RECIBIDO:         " + fmt(order.paid) + "\n";
        t += "CAMBIO:           " + fmt(order.change) + "\n";
      }
      t += sep;
      t += "  GRACIAS POR TU COMPRA!\n\n\n";
      return t;
    }

    function print58System(order) {
      if (!order) return;
      var el = document.getElementById("thermal-receipt-58mm");
      el.innerHTML =
        "<div style=\"text-align:center;font-weight:bold;font-size:13px;\">SHOWROOM THE TWINS</div>" +
        "<div style=\"text-align:center;font-size:9px;\">ESPACIO COLABORATIVO PARA EMPRENDEDORES</div>" +
        "<div style=\"border-top:1px dashed #000;margin:4px 0;\"></div>" +
        "<div>Folio: <b>#" + order.id + "</b> | " + order.time + "</div>" +
        "<div>" + order.serviceType + " - " + order.table + "</div>" +
        "<div style=\"border-top:1px dashed #000;margin:4px 0;\"></div>" +
        order.items.map(function(i) {
          return "<div style=\"margin-bottom:3px;\"><div><b>" + i.qty + "x " + i.name + "</b></div>" +
            "<div style=\"display:flex;justify-content:space-between;\"><span>" + fmt(i.price) + " c/u</span><b>" + fmt(i.price * i.qty) + "</b></div></div>";
        }).join("") +
        "<div style=\"border-top:1px dashed #000;margin:4px 0;\"></div>" +
        "<div style=\"display:flex;justify-content:space-between;font-size:13px;font-weight:bold;\"><span>TOTAL:</span><span>" + fmt(order.totalSale) + "</span></div>" +
        (order.paymentMethod === "Efectivo"
          ? "<div style=\"display:flex;justify-content:space-between;\"><span>Cambio:</span><b>" + fmt(order.change) + "</b></div>"
          : "") +
        "<div style=\"height:10mm;\"></div>";
      addLiveLog("Ticket #" + order.id + " enviado a impresión 58mm");
      saveState();
      window.print();
    }

    async function connectBT() {
      if (!navigator.bluetooth) {
        alert("Usa Chrome/Edge en HTTPS o usa RawBT / Impresión 58mm.");
        return;
      }
      try {
        var device = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: ["000018f0-0000-1000-8000-00805f9b34fb", "49535343-fe7d-4ae5-8fa9-9fafd205e455"]
        });
        var server = await device.gatt.connect();
        var services = await server.getPrimaryServices();
        for (var i = 0; i < services.length; i++) {
          var chars = await services[i].getCharacteristics();
          for (var j = 0; j < chars.length; j++) {
            if (chars[j].properties.write || chars[j].properties.writeWithoutResponse) {
              btChar = chars[j];
              break;
            }
          }
          if (btChar) break;
        }
        state.printerStatus = "Conectada: " + (device.name || "MP58C6");
        addLiveLog("Impresora MP58C6 conectada");
        saveState();
        render();
      } catch (err) {
        alert("No se pudo conectar por Bluetooth.");
      }
    }

    async function printBT(order) {
      if (!order) return;
      if (!btChar) {
        await connectBT();
        if (!btChar) return;
      }
      var enc = new TextEncoder();
      var bytes = enc.encode(getReceiptText(order));
      for (var i = 0; i < bytes.length; i += 100) {
        await btChar.writeValue(bytes.slice(i, i + 100));
      }
      addLiveLog("Ticket #" + order.id + " impreso en MP58C6");
      saveState();
    }

    function printRaw(order) {
      if (!order) return;
      var txt = getReceiptText(order);
      window.location.href = "rawbt:base64," + btoa(unescape(encodeURIComponent(txt)));
    }

    function getSample() {
      return state.lastTicket || {
        id: 1001,
        time: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }),
        serviceType: "Comer aquí",
        table: "Barra 1",
        paymentMethod: "Efectivo",
        items: [{ name: "Hamburguesas", qty: 1, price: 90 }, { name: "Orden de Papas", qty: 1, price: 50 }],
        totalSale: 140,
        paid: 200,
        change: 60,
        note: "Prueba MP58C6"
      };
    }

    function editProd(id, field, val) {
      if (state.role !== "admin") return;
      var p = state.products.find(function(x) { return x.id === id; });
      if (!p) return;
      if (field === "name") {
        var clean = String(val).trim();
        if (!clean || clean === p.name) return;
        var old = p.name;
        p.name = clean;
        addInvLog("Cambio de Nombre", clean, '"' + old + '" -> "' + clean + '"');
      } else if (field === "category") {
        p.category = String(val).trim() || p.category;
        addInvLog("Cambio de Categoría", p.name, "Categoría: " + p.category);
      } else if (field === "costPrice") {
        var oldC = p.costPrice;
        p.costPrice = Math.max(0, parseFloat(val) || 0);
        addInvLog("Cambio de Costo", p.name, fmt(oldC) + " -> " + fmt(p.costPrice));
      } else if (field === "price") {
        var oldP = p.price;
        p.price = Math.max(0, parseFloat(val) || 0);
        addInvLog("Cambio de Precio", p.name, fmt(oldP) + " -> " + fmt(p.price));
      } else if (field === "stock") {
        var oldS = p.stock;
        p.stock = Math.max(0, parseInt(val) || 0);
        addInvLog("Ajuste de Stock", p.name, oldS + " -> " + p.stock + " uds");
      } else if (field === "infinite") {
        p.infinite = Boolean(val);
        addInvLog("Stock Infinito", p.name, p.infinite ? "Activado (∞)" : "Desactivado");
      }
      saveState();
      render();
    }

    function addStockQuick(id, qty) {
      if (state.role !== "admin") return;
      var p = state.products.find(function(x) { return x.id === id; });
      if (!p || p.infinite) return;
      var old = p.stock;
      p.stock += qty;
      addInvLog("Entrada Rápida", p.name, "+" + qty + " uds (" + old + " -> " + p.stock + ")");
      saveState();
      render();
    }

    function createProd(e) {
      e.preventDefault();
      if (state.role !== "admin") return;
      var f = e.target;
      var name = f.pName.value.trim();
      if (!name) return;
      var category = f.pCat.value.trim() || "Antojitos";
      var costPrice = parseFloat(f.pCost.value) || 0;
      var price = parseFloat(f.pPrice.value) || 0;
      var stock = parseInt(f.pStock.value) || 0;
      var infinite = f.pInf.checked;
      state.products.push({
        id: "P-" + Date.now(),
        name: name,
        category: category,
        costPrice: costPrice,
        price: price,
        stock: stock,
        infinite: infinite,
        desc: "Producto del menú"
      });
      addInvLog("Nuevo Producto", name, "Venta " + fmt(price) + " / Costo " + fmt(costPrice));
      f.reset();
      saveState();
      render();
    }

    function createMovement(e) {
      e.preventDefault();
      if (state.role !== "admin") return;
      var f = e.target;
      var category = f.mCat.value;
      var concept = f.mConcept.value.trim();
      var amount = parseFloat(f.mAmount.value) || 0;
      var fromDrawer = f.mDrawer.checked;
      if (!concept || amount <= 0) return;
      state.cashMovements.unshift({
        id: Date.now(),
        date: new Date().toLocaleDateString("es-MX"),
        time: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }),
        category: category,
        concept: concept,
        amount: amount,
        fromDrawer: fromDrawer
      });
      addLiveLog(category + ": " + concept + " (" + fmt(amount) + ")");
      f.reset();
      f.mDrawer.checked = true;
      saveState();
      render();
    }

    function reprintOrderById(id) {
      var found = state.orders.find(function(x) { return x.id === id; });
      if (found) print58System(found);
    }

    function render() {
      var isAdmin = state.role === "admin";
      var fin = getFinancials();
      var cartTotal = state.cart.reduce(function(s, i) { return s + i.price * i.qty; }, 0);
      var cartCost = state.cart.reduce(function(s, i) { return s + i.costPrice * i.qty; }, 0);
      var cartProfit = cartTotal - cartCost;
      var cartReinvest = cartProfit > 0 ? cartProfit * (state.reinvestPercent / 100) : 0;
      var paidNum = parseFloat(state.amountPaid) || 0;
      var changeNum = state.paymentMethod === "Efectivo" && paidNum >= cartTotal ? paidNum - cartTotal : 0;

      var cats = ["Todos"].concat(Array.from(new Set(state.products.map(function(p) { return p.category; }))));
      var items = state.products.filter(function(p) {
        var okCat = state.selectedCategory === "Todos" || p.category === state.selectedCategory;
        var okQ = p.name.toLowerCase().indexOf(state.searchQuery.toLowerCase()) !== -1;
        return okCat && okQ;
      });

      var html = "";

      if (state.showAuthModal) {
        html += '<div class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">' +
          '<form onsubmit="handleAuthSubmit(event)" class="bg-white rounded-2xl max-w-sm w-full p-5 space-y-3 border-2 border-amber-400">' +
            '<h3 class="font-black text-[#081736] text-base">Acceso Administrador</h3>' +

          '</div>' +
        '</div>';
      }

      if (state.activeTab === "printer") {
        html += '<div class="bg-white p-5 rounded-2xl border max-w-xl mx-auto space-y-4 text-xs">' +

          '<div class="grid grid-cols-3 gap-2 font-bold">' +
            '<button onclick="printBT(getSample())" class="bg-blue-600 text-white py-2.5 rounded-lg">BT Directo</button>' +

      html += '</main>';
      document.getElementById("app").innerHTML = html;
    }

    render();
  </script>
