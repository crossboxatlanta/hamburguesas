<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SHOWROOM The Twins — Punto de Venta & Control Financiero</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
    body { font-family: 'Inter', sans-serif; }
    @media print {
      @page { size: 58mm auto; margin: 0; }
      body * { visibility: hidden !important; }
      #thermal-receipt-58mm, #thermal-receipt-58mm * { visibility: visible !important; }
      #thermal-receipt-58mm {
        position: fixed !important;
        left: 0 !important;
        top: 0 !important;
        width: 58mm !important;
        padding: 3mm 2.5mm !important;
        margin: 0 !important;
        background: #fff !important;
        color: #000 !important;
        font-family: 'Courier New', Courier, monospace !important;
        font-size: 11px !important;
        line-height: 1.25 !important;
        box-shadow: none !important;
        border: none !important;
      }
    }
    .ticket-58mm {
      width: 240px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 11px;
      line-height: 1.25;
      color: #000;
      background: #fff;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen">
  <div id="app"></div>

  <!-- Contenedor oculto exclusivo para impresión térmica 58mm -->
  <div id="thermal-receipt-58mm" class="hidden print:block"></div>

  <script>
    const STORAGE_KEY = 'the_twins_showroom_pos_v3';

    const DEFAULT_STATE = {
      businessName: 'SHOWROOM The Twins',
      subtitle: 'ESPACIO COLABORATIVO PARA EMPRENDEDORES',
      location: 'Showroom / Puesto de Comida',
      role: 'seller', // 'seller' | 'admin'
      adminPassword: 'twins2026',
      showAuthModal: false,
      authError: '',
      pendingTabAfterAuth: null,
      showChangePassModal: false,
      reinvestPercent: 50,
      cashOpen: true,
      openingFund: 500,
      cashMovements: [],
      activeTab: 'pos',
      selectedCategory: 'Todos',
      searchQuery: '',
      serviceType: 'Comer aquí',
      selectedTable: 'Barra 1',
      paymentMethod: 'Efectivo',
      amountPaid: '',
      orderNote: '',
      cart: [],
      lastTicket: null,
      printerStatus: 'Desconectada (Lista para MP58C6)',
      products: [
        { id: 'TWR-01', name: 'Banderillas', category: 'Antojitos', costPrice: 28, price: 65, stock: 30, infinite: false, desc: 'Crujientes con aderezos' },
        { id: 'TWR-02', name: 'Orden de Papas', category: 'Snacks', costPrice: 20, price: 50, stock: 40, infinite: false, desc: 'Papas a la francesa doradas' },
        { id: 'TWR-03', name: 'Ramen', category: 'Especiales', costPrice: 38, price: 85, stock: 20, infinite: false, desc: 'Caldo preparado con huevo y cebollín' },
        { id: 'TWR-04', name: 'Marquesitas', category: 'Postres', costPrice: 12, price: 30, stock: 35, infinite: false, desc: 'Crujiente rellena tradicional' },
        { id: 'TWR-05', name: 'Hamburguesas (Arrachera y Sirloin)', category: 'Platillos', costPrice: 45, price: 90, stock: 25, infinite: false, desc: 'Carne de arrachera y sirloin con queso y vegetales' },
        { id: 'TWR-06', name: 'Orden de Alitas', category: 'Platillos', costPrice: 46, price: 90, stock: 25, infinite: false, desc: 'Incluye papas a la francesa y aderezo' },
        { id: 'TWR-07', name: 'Refresco / Bebida', category: 'Bebidas', costPrice: 11, price: 25, stock: 0, infinite: true, desc: 'Lata o botella fría' },
        { id: 'TWR-08', name: 'Extra Queso / Tocino', category: 'Extras', costPrice: 8, price: 20, stock: 0, infinite: true, desc: 'Complemento adicional' }
      ],
      tables: [
        { id: 'Barra 1', zone: 'Barra', status: 'Libre', total: 0 },
        { id: 'Barra 2', zone: 'Barra', status: 'Libre', total: 0 },
        { id: 'Mesa 1', zone: 'Showroom', status: 'Libre', total: 0 },
        { id: 'Mesa 2', zone: 'Showroom', status: 'Libre', total: 0 },
        { id: 'Mesa 3', zone: 'Terraza', status: 'Libre', total: 0 },
        { id: 'Para Llevar', zone: 'Express', status: 'Libre', total: 0 }
      ],
      orders: [],
      inventoryLogs: [
        {
          id: 1,
          date: new Date().toLocaleDateString('es-MX'),
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          action: 'Inicio',
          product: 'Catálogo inicial cargado',
          detail: '8 productos iniciales registrados en sistema',
          user: 'Sistema'
        }
      ],
      liveLogs: [
        { time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }), msg: 'Sistema iniciado — SHOWROOM The Twins (Modo Vendedor)', type: 'system' }
      ]
    };

    let state = loadState();
    let btCharacteristic = null;

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          return {
            ...DEFAULT_STATE,
            ...parsed,
            showAuthModal: false,
            authError: '',
            pendingTabAfterAuth: null,
            showChangePassModal: false,
            cart: parsed.cart || [],
            inventoryLogs: parsed.inventoryLogs || DEFAULT_STATE.inventoryLogs,
            cashMovements: parsed.cashMovements || []
          };
        }
      } catch (e) {}
      return JSON.parse(JSON.stringify(DEFAULT_STATE));
    }

    function saveState() {
      try {
        const toSave = { ...state, showAuthModal: false, authError: '', pendingTabAfterAuth: null, showChangePassModal: false };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
      } catch (e) {}
    }

    function addLog(msg, type = 'info') {
      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      state.liveLogs.unshift({ time, msg, type });
      if (state.liveLogs.length > 50) state.liveLogs.pop();
    }

    function addInventoryLog(action, product, detail, user = null) {
      const now = new Date();
      state.inventoryLogs.unshift({
        id: Date.now() + Math.random(),
        date: now.toLocaleDateString('es-MX'),
        time: now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
        action,
        product,
        detail,
        user: user || (state.role === 'admin' ? 'Administrador' : 'Vendedor')
      });
      if (state.inventoryLogs.length > 120) state.inventoryLogs.pop();
    }

    function fmt(num) {
      return '$' + Number(num || 0).toFixed(2);
    }

    function calcFinancials(saleTotal, costTotal) {
      const profit = saleTotal - costTotal;
      const reinvest = profit > 0 ? (profit * (state.reinvestPercent / 100)) : 0;
      const freeProfit = profit - reinvest;
      return { profit, reinvest, freeProfit };
    }

    // --- CÁLCULO INTEGRAL DE UTILIDAD DESPUÉS DE REINVERSIÓN, SUELDOS Y GASTOS ---
    function getFullFinancialSummary() {
      const validOrders = state.orders.filter(o => o.status !== 'Cancelado');
      const totalSalesDay = validOrders.reduce((s, o) => s + o.totalSale, 0);
      const totalCostDay = validOrders.reduce((s, o) => s + o.totalCost, 0);
      const grossProfitDay = totalSalesDay - totalCostDay;

      // Reinversión calculada sobre la ganancia bruta de ventas
      const totalReinvestDay = grossProfitDay > 0 ? (grossProfitDay * (state.reinvestPercent / 100)) : 0;

      // Desglose de movimientos de gastos y sueldos
      const payrollTotal = state.cashMovements
        .filter(m => m.category === 'Sueldos / Nómina')
        .reduce((s, m) => s + m.amount, 0);

      const operationalExpensesTotal = state.cashMovements
        .filter(m => m.category === 'Gasto Operativo / Insumos' || m.category === 'Servicios / Renta')
        .reduce((s, m) => s + m.amount, 0);

      const ownerWithdrawalsTotal = state.cashMovements
        .filter(m => m.category === 'Retiro Dueño')
        .reduce((s, m) => s + m.amount, 0);

      const extraIncomeTotal = state.cashMovements
        .filter(m => m.category === 'Ingreso Adicional')
        .reduce((s, m) => s + m.amount, 0);

      // Ganancia neta final después de reinvertir, pagar sueldos y cubrir gastos operativos
      const netProfitAfterAll = grossProfitDay + extraIncomeTotal - totalReinvestDay - payrollTotal - operationalExpensesTotal;

      return {
        validOrdersCount: validOrders.length,
        totalSalesDay,
        totalCostDay,
        grossProfitDay,
        totalReinvestDay,
        payrollTotal,
        operationalExpensesTotal,
        ownerWithdrawalsTotal,
        extraIncomeTotal,
        netProfitAfterAll
      };
    }

    // --- AUTENTICACIÓN DE ADMINISTRADOR CON CONTRASEÑA ---
    function openAdminAuthModal(targetTab = null) {
      state.showAuthModal = true;
      state.authError = '';
      state.pendingTabAfterAuth = targetTab;
      render();
      setTimeout(() => {
        const inp = document.getElementById('admin-pass-input');
        if (inp) inp.focus();
      }, 50);
    }

    function closeAdminAuthModal() {
      state.showAuthModal = false;
      state.authError = '';
      state.pendingTabAfterAuth = null;
      render();
    }

    function submitAdminPassword(e) {
      e.preventDefault();
      const input = document.getElementById('admin-pass-input');
      const val = input ? input.value : '';
      if (val === state.adminPassword) {
        state.role = 'admin';
        state.showAuthModal = false;
        state.authError = '';
        if (state.pendingTabAfterAuth) {
          state.activeTab = state.pendingTabAfterAuth;
          state.pendingTabAfterAuth = null;
        }
        addLog('Inicio de sesión en Modo Administrador', 'system');
        saveState();
        render();
      } else {
        state.authError = 'Contraseña incorrecta. Intenta de nuevo.';
        render();
        setTimeout(() => {
          const inp = document.getElementById('admin-pass-input');
          if (inp) inp.focus();
        }, 50);
      }
    }

    function switchRole(targetRole) {
      if (targetRole === 'seller') {
        state.role = 'seller';
        if (state.activeTab === 'inventory' || state.activeTab === 'cash') {
          state.activeTab = 'pos';
        }
        addLog('Cambio a Modo Vendedor (acceso restringido activo)', 'system');
        saveState();
        render();
        return;
      }
      openAdminAuthModal(null);
    }

    function openChangePassModal() {
      if (state.role !== 'admin') return;
      state.showChangePassModal = true;
      state.authError = '';
      render();
    }

    function closeChangePassModal() {
      state.showChangePassModal = false;
      state.authError = '';
      render();
    }

    function submitChangePassword(e) {
      e.preventDefault();
      const form = e.target;
      const currentPass = form.currentPass.value;
      const newPass = form.newPass.value.trim();
      const confirmPass = form.confirmPass.value.trim();

      if (currentPass !== state.adminPassword) {
        state.authError = 'La contraseña actual no coincide.';
        render();
        return;
      }
      if (newPass.length < 4) {
        state.authError = 'La nueva contraseña debe tener al menos 4 caracteres.';
        render();
        return;
      }
      if (newPass !== confirmPass) {
        state.authError = 'La confirmación de contraseña no coincide.';
        render();
        return;
      }

      state.adminPassword = newPass;
      state.showChangePassModal = false;
      state.authError = '';
      addLog('Contraseña de Administrador actualizada correctamente', 'system');
      saveState();
      render();
      alert('Contraseña de Administrador actualizada con éxito.');
    }

    function selectTab(tabKey) {
      const adminOnlyTabs = ['inventory', 'cash'];
      if (adminOnlyTabs.includes(tabKey) && state.role !== 'admin') {
        openAdminAuthModal(tabKey);
        return;
      }
      state.activeTab = tabKey;
      saveState();
      render();
    }

    // --- ACCIONES DEL CARRITO ---
    function addToCart(productId) {
      const prod = state.products.find(p => p.id === productId);
      if (!prod) return;
      if (!prod.infinite && prod.stock <= 0) {
        alert('Producto agotado en inventario.');
        return;
      }
      const existing = state.cart.find(item => item.id === productId);
      if (existing) {
        if (!prod.infinite && existing.qty + 1 > prod.stock) {
          alert('No hay más stock disponible de ' + prod.name);
          return;
        }
        existing.qty += 1;
      } else {
        state.cart.push({
          id: prod.id,
          name: prod.name,
          costPrice: Number(prod.costPrice),
          price: Number(prod.price),
          qty: 1
        });
      }
      saveState();
      render();
    }

    function updateCartQty(idx, delta) {
      const item = state.cart[idx];
      if (!item) return;
      const prod = state.products.find(p => p.id === item.id);
      const nextQty = item.qty + delta;
      if (nextQty <= 0) {
        state.cart.splice(idx, 1);
      } else {
        if (prod && !prod.infinite && nextQty > prod.stock) {
          alert('Stock máximo alcanzado.');
          return;
        }
        item.qty = nextQty;
      }
      saveState();
      render();
    }

    function clearCart() {
      state.cart = [];
      state.amountPaid = '';
      state.orderNote = '';
      saveState();
      render();
    }

    function confirmOrder() {
      if (!state.cashOpen) {
        alert('La caja está cerrada. Solicita al Administrador abrir caja.');
        return;
      }
      if (state.cart.length === 0) return;

      const totalSale = state.cart.reduce((s, i) => s + i.price * i.qty, 0);
      const totalCost = state.cart.reduce((s, i) => s + i.costPrice * i.qty, 0);
      const paid = state.paymentMethod === 'Efectivo' ? (parseFloat(state.amountPaid) || totalSale) : totalSale;

      if (state.paymentMethod === 'Efectivo' && paid < totalSale) {
        alert('El monto recibido es menor al total de la venta.');
        return;
      }

      const change = state.paymentMethod === 'Efectivo' ? Math.max(0, paid - totalSale) : 0;
      const fin = calcFinancials(totalSale, totalCost);
      const folio = 1000 + state.orders.length + 1;

      state.cart.forEach(item => {
        const prod = state.products.find(p => p.id === item.id);
        if (prod && !prod.infinite) {
          const prevStock = prod.stock;
          prod.stock = Math.max(0, prod.stock - item.qty);
          addInventoryLog(
            'Salida por Venta',
            prod.name,
            `Venta #${folio}: -${item.qty} uds (Stock: ${prevStock} → ${prod.stock})`,
            state.role === 'admin' ? 'Administrador' : 'Vendedor'
          );
          if (prod.stock <= 5) {
            addLog(`Stock bajo en ${prod.name}: quedan ${prod.stock} uds`, 'alert');
          }
        }
      });

      const order = {
        id: folio,
        date: new Date().toLocaleString('es-MX'),
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        items: JSON.parse(JSON.stringify(state.cart)),
        serviceType: state.serviceType,
        table: state.selectedTable,
        paymentMethod: state.paymentMethod,
        totalSale,
        totalCost,
        profit: fin.profit,
        reinvest: fin.reinvest,
        freeProfit: fin.freeProfit,
        reinvestPercent: state.reinvestPercent,
        paid,
        change,
        note: state.orderNote,
        status: 'Preparando'
      };

      state.orders.unshift(order);
      state.lastTicket = order;

      if (state.serviceType === 'Comer aquí') {
        const tbl = state.tables.find(t => t.id === state.selectedTable);
        if (tbl) {
          tbl.status = 'Ocupada';
          tbl.total = (tbl.total || 0) + totalSale;
        }
      }

      addLog(`Venta #${folio} registrada por ${fmt(totalSale)} (${state.paymentMethod})`, 'sale');
      state.cart = [];
      state.amountPaid = '';
      state.orderNote = '';
      saveState();
      render();
    }

    // --- IMPRESIÓN TÉRMICA 58MM (MP58C6) ---
    function buildPlainReceiptText(order) {
      const line = '--------------------------------';
      let txt = '';
      txt += '      SHOWROOM THE TWINS
';
      txt += '  ESPACIO COLABORATIVO EMPREND.
';
      txt += line + '
';
      txt += `Folio: #${order.id}  ${order.time}
`;
      txt += `Servicio: ${order.serviceType} (${order.table})
`;
      txt += `Pago: ${order.paymentMethod}
`;
      txt += line + '
';
      order.items.forEach(it => {
        const sub = (it.price * it.qty).toFixed(2);
        txt += `${it.qty}x ${it.name.substring(0, 18)}
`;
        txt += `   $${it.price.toFixed(2)} c/u      $${sub}
`;
      });
      if (order.note) {
        txt += `Nota: ${order.note}
`;
      }
      txt += line + '
';
      txt += `TOTAL:              $${order.totalSale.toFixed(2)}
`;
      if (order.paymentMethod === 'Efectivo') {
        txt += `RECIBIDO:           $${order.paid.toFixed(2)}
`;
        txt += `CAMBIO:             $${order.change.toFixed(2)}
`;
      }
      txt += line + '
';
      txt += '  ¡GRACIAS POR TU COMPRA!


';
      return txt;
    }

    function printSystem58mm(order) {
      if (!order) return;
      const el = document.getElementById('thermal-receipt-58mm');
      el.innerHTML = `
        <div style="text-align:center; font-weight:bold; font-size:13px;">SHOWROOM THE TWINS</div>
        <div style="text-align:center; font-size:9px;">ESPACIO COLABORATIVO PARA EMPRENDEDORES</div>
        <div style="border-top:1px dashed #000; margin:4px 0;"></div>
        <div>Folio: <b>#${order.id}</b> | ${order.time}</div>
        <div>Servicio: ${order.serviceType} - ${order.table}</div>
        <div>Pago: ${order.paymentMethod}</div>
        <div style="border-top:1px dashed #000; margin:4px 0;"></div>
        ${order.items.map(i => `
          <div style="margin-bottom:3px;">
            <div><b>${i.qty}x ${i.name}</b></div>
            <div style="display:flex; justify-content:space-between;">
              <span>${fmt(i.price)} c/u</span>
              <span><b>${fmt(i.price * i.qty)}</b></span>
            </div>
          </div>
        `).join('')}
        ${order.note ? `<div style="font-size:10px; margin-top:2px;">Nota: ${order.note}</div>` : ''}
        <div style="border-top:1px dashed #000; margin:4px 0;"></div>
        <div style="display:flex; justify-content:space-between; font-size:13px; font-weight:bold;">
          <span>TOTAL:</span><span>${fmt(order.totalSale)}</span>
        </div>
        ${order.paymentMethod === 'Efectivo' ? `
          <div style="display:flex; justify-content:space-between;"><span>Recibido:</span><span>${fmt(order.paid)}</span></div>
          <div style="display:flex; justify-content:space-between; font-weight:bold;"><span>Cambio:</span><span>${fmt(order.change)}</span></div>
        ` : ''}
        <div style="border-top:1px dashed #000; margin:6px 0;"></div>
        <div style="text-align:center; font-size:10px;">¡Gracias por apoyar a emprendedores!</div>
        <div style="height:12mm;"></div>
      `;
      addLog(`Ticket #${order.id} enviado a impresión 58mm`, 'print');
      saveState();
      window.print();
    }

    async function connectBluetoothMP58C6() {
      if (!navigator.bluetooth) {
        alert('Tu navegador no soporta Web Bluetooth directo. Usa Chrome/Edge en Android o Windows, o usa el botón RawBT / Impresión 58mm.');
        return;
      }
      try {
        state.printerStatus = 'Buscando MP58C6...';
        render();
        const device = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: ['000018f0-0000-1000-8000-00805f9b34fb', '49535343-fe7d-4ae5-8fa9-9fafd205e455']
        });
        const server = await device.gatt.connect();
        const services = await server.getPrimaryServices();
        for (const service of services) {
          const chars = await service.getCharacteristics();
          for (const ch of chars) {
            if (ch.properties.write || ch.properties.writeWithoutResponse) {
              btCharacteristic = ch;
              break;
            }
          }
          if (btCharacteristic) break;
        }
        state.printerStatus = `Conectada: ${device.name || 'MP58C6'}`;
        addLog(`Impresora Bluetooth conectada: ${device.name || 'MP58C6'}`, 'print');
        saveState();
        render();
      } catch (err) {
        state.printerStatus = 'No conectada (Intenta de nuevo o usa RawBT/58mm)';
        render();
      }
    }

    async function printBluetoothESCPOS(order) {
      if (!order) return;
      if (!btCharacteristic) {
        await connectBluetoothMP58C6();
        if (!btCharacteristic) return;
      }
      try {
        const encoder = new TextEncoder();
        const init = new Uint8Array([0x1B, 0x40]);
        const textBytes = encoder.encode(buildPlainReceiptText(order));
        const payload = new Uint8Array(init.length + textBytes.length);
        payload.set(init, 0);
        payload.set(textBytes, init.length);

        const chunkSize = 100;
        for (let i = 0; i < payload.length; i += chunkSize) {
          const chunk = payload.slice(i, i + chunkSize);
          await btCharacteristic.writeValue(chunk);
        }
        addLog(`Ticket #${order.id} impreso por Bluetooth ESC/POS en MP58C6`, 'print');
        saveState();
        render();
      } catch (e) {
        alert('Se perdió la conexión Bluetooth con la MP58C6. Reconecta o usa Impresión 58mm.');
        btCharacteristic = null;
        state.printerStatus = 'Desconectada';
        render();
      }
    }

    function printRawBT(order) {
      if (!order) return;
      const text = buildPlainReceiptText(order);
      const url = 'rawbt:base64,' + btoa(unescape(encodeURIComponent(text)));
      addLog(`Ticket #${order.id} enviado a RawBT (Android)`, 'print');
      saveState();
      window.location.href = url;
    }

    // --- GESTIÓN DE INVENTARIO CON BITÁCORA DETALLADA ---
    function updateProductField(id, field, value) {
      if (state.role !== 'admin') return;
      const prod = state.products.find(p => p.id === id);
      if (!prod) return;

      if (field === 'name') {
        const cleanName = String(value).trim();
        if (!cleanName || cleanName === prod.name) return;
        const oldName = prod.name;
        prod.name = cleanName;
        addInventoryLog('Cambio de Nombre', cleanName, `Renombrado: "${oldName}" → "${cleanName}"`);
        addLog(`Producto renombrado: "${oldName}" → "${cleanName}"`, 'system');
      } else if (field === 'category') {
        const cleanCat = String(value).trim();
        if (!cleanCat || cleanCat === prod.category) return;
        const oldCat = prod.category;
        prod.category = cleanCat;
        addInventoryLog('Cambio de Categoría', prod.name, `Categoría: "${oldCat}" → "${cleanCat}"`);
      } else if (field === 'infinite') {
        const nextInf = Boolean(value);
        if (nextInf === prod.infinite) return;
        prod.infinite = nextInf;
        addInventoryLog('Modo Stock', prod.name, nextInf ? 'Activado Stock Infinito (∞)' : `Desactivado Stock Infinito (Stock actual: ${prod.stock})`);
      } else if (field === 'costPrice') {
        const nextVal = Math.max(0, parseFloat(value) || 0);
        if (nextVal === prod.costPrice) return;
        const oldVal = prod.costPrice;
        prod.costPrice = nextVal;
        addInventoryLog('Cambio de Costo', prod.name, `Costo compra: ${fmt(oldVal)} → ${fmt(nextVal)}`);
      } else if (field === 'price') {
        const nextVal = Math.max(0, parseFloat(value) || 0);
        if (nextVal === prod.price) return;
        const oldVal = prod.price;
        prod.price = nextVal;
        addInventoryLog('Cambio de Precio', prod.name, `Precio venta: ${fmt(oldVal)} → ${fmt(nextVal)}`);
      } else if (field === 'stock') {
        const nextVal = Math.max(0, parseInt(value) || 0);
        if (nextVal === prod.stock) return;
        const oldVal = prod.stock;
        const diff = nextVal - oldVal;
        prod.stock = nextVal;
        addInventoryLog(
          diff > 0 ? 'Entrada de Stock' : 'Ajuste de Stock',
          prod.name,
          `Existencias: ${oldVal} → ${nextVal} (${diff > 0 ? '+' + diff : diff} uds)`
        );
        addLog(`Inventario ajustado en ${prod.name}: ${oldVal} → ${nextVal} uds`, 'info');
      }

      saveState();
      render();
    }

    function quickAddStock(id, amount) {
      if (state.role !== 'admin') return;
      const prod = state.products.find(p => p.id === id);
      if (!prod || prod.infinite) return;
      const oldStock = prod.stock;
      prod.stock += amount;
      addInventoryLog('Entrada Rápida', prod.name, `Se agregaron +${amount} uds (${oldStock} → ${prod.stock})`);
      addLog(`+${amount} uds agregadas a ${prod.name} (Total: ${prod.stock})`, 'info');
      saveState();
      render();
    }

    function deleteProduct(id) {
      if (state.role !== 'admin') return;
      const idx = state.products.findIndex(p => p.id === id);
      if (idx === -1) return;
      const prod = state.products[idx];
      if (!confirm(`¿Seguro que deseas eliminar "${prod.name}" del menú?`)) return;
      state.products.splice(idx, 1);
      addInventoryLog('Producto Eliminado', prod.name, `Eliminado del catálogo (tenía ${prod.infinite ? '∞' : prod.stock + ' uds'})`);
      addLog(`Producto eliminado del menú: ${prod.name}`, 'alert');
      saveState();
      render();
    }

    function addNewProduct(e) {
      e.preventDefault();
      if (state.role !== 'admin') return;
      const form = e.target;
      const name = form.prodName.value.trim();
      const category = form.prodCategory.value.trim() || 'Antojitos';
      const desc = form.prodDesc.value.trim() || 'Platillo del menú';
      const costPrice = parseFloat(form.prodCost.value) || 0;
      const price = parseFloat(form.prodPrice.value) || 0;
      const stock = parseInt(form.prodStock.value) || 0;
      const infinite = form.prodInfinite.checked;
      if (!name) return;

      const newId = 'TWR-' + String(Date.now()).slice(-4);
      state.products.push({
        id: newId,
        name,
        category,
        costPrice,
        price,
        stock,
        infinite,
        desc
      });
      addInventoryLog(
        'Nuevo Producto',
        name,
        `Agregado (${category}) • Costo: ${fmt(costPrice)} • Venta: ${fmt(price)} • Stock: ${infinite ? '∞' : stock + ' uds'}`
      );
      addLog(`Nuevo producto agregado: ${name} (${fmt(price)})`, 'system');
      form.reset();
      saveState();
      render();
    }

    function toggleTableStatus(tableId) {
      const tbl = state.tables.find(t => t.id === tableId);
      if (!tbl) return;
      if (tbl.status === 'Libre') {
        tbl.status = 'Ocupada';
      } else if (tbl.status === 'Ocupada') {
        tbl.status = 'Cuenta pedida';
      } else {
        tbl.status = 'Libre';
        tbl.total = 0;
      }
      addLog(`${tbl.id} cambió a estado: ${tbl.status}`, 'info');
      saveState();
      render();
    }

    function selectTableForOrder(tableId) {
      state.selectedTable = tableId;
      state.serviceType = tableId === 'Para Llevar' ? 'Para llevar' : 'Comer aquí';
      state.activeTab = 'pos';
      saveState();
      render();
    }

    function updateOrderStatus(orderId, status) {
      if (status === 'Cancelado' && state.role !== 'admin') {
        alert('Solo el Administrador puede cancelar un pedido registrado.');
        return;
      }
      const ord = state.orders.find(o => o.id === orderId);
      if (!ord) return;
      const prevStatus = ord.status;
      ord.status = status;

      if (status === 'Cancelado' && prevStatus !== 'Cancelado') {
        ord.items.forEach(item => {
          const prod = state.products.find(p => p.id === item.id);
          if (prod && !prod.infinite) {
            const oldStock = prod.stock;
            prod.stock += item.qty;
            addInventoryLog('Devolución por Cancelación', prod.name, `Pedido #${ord.id} cancelado: +${item.qty} uds (${oldStock} → ${prod.stock})`);
          }
        });
      }

      addLog(`Pedido #${orderId} marcado como: ${status}`, 'info');
      saveState();
      render();
    }

    // --- CONTROL DE GASTOS, SUELDOS Y MOVIMIENTOS DE CAJA ---
    function addCashMovement(e) {
      e.preventDefault();
      if (state.role !== 'admin') return;
      const form = e.target;
      const category = form.movCategory.value;
      const concept = form.movConcept.value.trim();
      const amount = parseFloat(form.movAmount.value) || 0;
      const paidFromDrawer = form.movFromDrawer.checked;
      if (!concept || amount <= 0) return;

      state.cashMovements.unshift({
        id: Date.now() + Math.random(),
        date: new Date().toLocaleDateString('es-MX'),
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        category,
        concept,
        amount,
        paidFromDrawer
      });
      addLog(`Registro financiero (${category}): ${concept} por ${fmt(amount)}`, 'info');
      form.reset();
      form.movFromDrawer.checked = true;
      saveState();
      render();
    }

    function deleteCashMovement(id) {
      if (state.role !== 'admin') return;
      const idx = state.cashMovements.findIndex(m => m.id === id);
      if (idx === -1) return;
      const mov = state.cashMovements[idx];
      if (!confirm(`¿Eliminar el registro "${mov.concept}" (${fmt(mov.amount)})?`)) return;
      state.cashMovements.splice(idx, 1);
      addLog(`Movimiento eliminado: ${mov.concept} (${fmt(mov.amount)})`, 'alert');
      saveState();
      render();
    }

    function toggleCashRegister() {
      if (state.role !== 'admin') return;
      if (state.cashOpen) {
        const counted = prompt('Ingresa el efectivo físico contado en caja:');
        if (counted === null) return;
        const cashSales = state.orders
          .filter(o => o.status !== 'Cancelado' && o.paymentMethod === 'Efectivo')
          .reduce((s, o) => s + o.totalSale, 0);
        const drawerOut = state.cashMovements
          .filter(m => m.category !== 'Ingreso Adicional' && m.paidFromDrawer)
          .reduce((s, m) => s + m.amount, 0);
        const drawerIn = state.cashMovements
          .filter(m => m.category === 'Ingreso Adicional' && m.paidFromDrawer)
          .reduce((s, m) => s + m.amount, 0);
        const expected = state.openingFund + cashSales + drawerIn - drawerOut;
        const diff = (parseFloat(counted) || 0) - expected;
        state.cashOpen = false;
        addLog(`Caja CERRADA. Esperado: ${fmt(expected)} | Contado: ${fmt(counted)} | Diferencia: ${fmt(diff)}`, 'alert');
      } else {
        const fund = prompt('Fondo inicial de caja en efectivo ($):', '500');
        if (fund === null) return;
        state.openingFund = parseFloat(fund) || 0;
        state.cashOpen = true;
        addLog(`Caja ABIERTA con fondo inicial de ${fmt(state.openingFund)}`, 'system');
      }
      saveState();
      render();
    }

    function renderPOS(isAdmin, categories, filteredProducts, cartTotal, cartCost, cartFin, changeVal) {

                        outOfStock
                          ? 'bg-slate-100 border-slate-200 opacity-60 cursor-not-allowed'

                      <div class="flex justify-between items-start gap-2">

                          <p class="text-xs text-slate-500 mt-0.5">${prod.desc || ''}</p>
                        </div>

                        </div>
                      </div>
                      <div class="mt-3 pt-2 border-t border-slate-100 flex justify-between items-center text-[11px]">

      const validOrders = state.orders.filter(o => o.status !== 'Cancelado');

      const cardSales = validOrders.filter(o => o.paymentMethod === 'Tarjeta').reduce((s, o) => s + o.totalSale, 0);
      const transferSales = validOrders.filter(o => o.paymentMethod === 'Transferencia').reduce((s, o) => s + o.totalSale, 0);

      const drawerOut = state.cashMovements
        .filter(m => m.category !== 'Ingreso Adicional' && m.paidFromDrawer)
        .reduce((s, m) => s + m.amount, 0);
      const drawerIn = state.cashMovements
        .filter(m => m.category === 'Ingreso Adicional' && m.paidFromDrawer)
        .reduce((s, m) => s + m.amount, 0);
      const expectedCash = state.openingFund + cashSales + drawerIn - drawerOut;

      return `
        <div class="space-y-5">
          <!-- ESTADO DE RESULTADOS DEL NEGOCIO (DESPUÉS DE REINVERTIR Y PAGAR SUELDOS) -->
          <div class="bg-[#081736] text-white p-5 rounded-2xl border-2 border-amber-400 shadow-lg">
            <div class="flex flex-wrap justify-between items-center gap-2 mb-4">
              <div>
                <h2 class="font-black text-amber-400 text-lg">Estado Financiero Real — SHOWROOM The Twins</h2>
                <p class="text-xs text-slate-300">Desglose automático: Ventas − Costo Insumos − Reinversión (${state.reinvestPercent}%) − Sueldos − Gastos Operativos</p>
              </div>
              <span class="text-xs bg-white/10 px-3 py-1.5 rounded-lg font-bold text-amber-200">
                % Reinversión actual: ${state.reinvestPercent}%
              </span>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
              <div class="bg-white/10 p-4 rounded-xl space-y-2">
                <div class="flex justify-between"><span>1. Ingresos por Ventas Totales:</span><b class="text-white">${fmt(fin.totalSalesDay)}</b></div>
                <div class="flex justify-between text-slate-300"><span>2. (-) Costo de Compra de Insumos:</span><b>-${fmt(fin.totalCostDay)}</b></div>
                <div class="flex justify-between text-emerald-300 font-bold border-t border-white/15 pt-1.5">
                  <span>= Ganancia Bruta de Ventas:</span><span>${fmt(fin.grossProfitDay)}</span>
                </div>
                <div class="flex justify-between text-amber-300"><span>3. (-) Fondo Separado para Reinversión (${state.reinvestPercent}%):</span><b>-${fmt(fin.totalReinvestDay)}</b></div>
                <div class="flex justify-between text-purple-300"><span>4. (-) Pago de Sueldos / Nómina:</span><b>-${fmt(fin.payrollTotal)}</b></div>
                <div class="flex justify-between text-rose-300"><span>5. (-) Gastos Operativos (gas, renta, insumos extra):</span><b>-${fmt(fin.operationalExpensesTotal)}</b></div>
                ${fin.extraIncomeTotal > 0 ? `<div class="flex justify-between text-blue-300"><span>6. (+) Ingresos Adicionales:</span><b>+${fmt(fin.extraIncomeTotal)}</b></div>` : ''}
              </div>

              <div class="bg-white text-slate-900 p-4 rounded-xl flex flex-col justify-between">
                <div>
                  <div class="text-xs font-extrabold uppercase text-slate-500">Ganancia Neta Final Disponible para Ti</div>
                  <div class="text-3xl font-black mt-1 ${fin.netProfitAfterAll >= 0 ? 'text-emerald-600' : 'text-rose-600'}">
                    ${fmt(fin.netProfitAfterAll)}
                  </div>
                  <p class="text-[11px] text-slate-500 mt-1">
                    Este monto es lo que realmente te queda libre después de haber apartado tu reinversión (${fmt(fin.totalReinvestDay)}), pagado sueldos (${fmt(fin.payrollTotal)}) y cubierto gastos (${fmt(fin.operationalExpensesTotal)}).
                  </p>
                </div>
                ${fin.ownerWithdrawalsTotal > 0 ? `
                  <div class="mt-3 pt-2 border-t border-slate-200 flex justify-between text-xs font-bold text-slate-700">
                    <span>Retiros personales ya realizados:</span>
                    <span>${fmt(fin.ownerWithdrawalsTotal)} (Restante: ${fmt(fin.netProfitAfterAll - fin.ownerWithdrawalsTotal)})</span>
                  </div>
                ` : ''}
              </div>
            </div>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-12 gap-5">
            <!-- FORMULARIO DE REGISTRO DE GASTOS Y SUELDOS -->
            <div class="lg:col-span-7 bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4">
              <div>
                <h2 class="font-extrabold text-[#081736] text-base">Registrar Gasto, Pago de Sueldo o Movimiento</h2>
                <p class="text-xs text-slate-500">Selecciona si es sueldo de personal, gasto operativo o retiro, y si el dinero salió de la caja física.</p>
              </div>

              <form onsubmit="addCashMovement(event)" class="space-y-3 text-xs">
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
                  <div>
                    <label class="font-bold text-slate-600 block mb-1">Categoría</label>
                    <select name="movCategory" class="w-full border border-slate-300 rounded-lg px-2.5 py-2 font-bold">
                      <option value="Sueldos / Nómina">👷 Sueldos / Nómina</option>
                      <option value="Gasto Operativo / Insumos">🧾 Gasto Operativo / Insumos</option>
                      <option value="Servicios / Renta">🏠 Servicios / Renta / Gas</option>
                      <option value="Retiro Dueño">💼 Retiro de Ganancia Dueño</option>
                      <option value="Ingreso Adicional">➕ Ingreso Adicional</option>
                    </select>
                  </div>
                  <div>
                    <label class="font-bold text-slate-600 block mb-1">Concepto / Empleado</label>
                    <input name="movConcept" required placeholder="Ej. Turno Juan, tanque gas, hielo..." class="w-full border border-slate-300 rounded-lg px-3 py-2" />
                  </div>
                  <div>
                    <label class="font-bold text-slate-600 block mb-1">Monto ($)</label>
                    <input name="movAmount" type="number" step="0.01" required placeholder="0.00" class="w-full border border-slate-300 rounded-lg px-2.5 py-2 font-bold" />
                  </div>
                </div>

                <div class="flex flex-wrap justify-between items-center gap-2 pt-1">
                  <label class="flex items-center gap-2 font-semibold text-slate-700 cursor-pointer">
                    <input name="movFromDrawer" type="checkbox" checked class="w-4 h-4 accent-[#081736]" />
                    <span>El dinero salió/entró en efectivo de la caja física</span>
                  </label>
                  <button type="submit" class="bg-[#081736] hover:bg-[#10295c] text-amber-400 font-extrabold px-4 py-2 rounded-lg">
                    + Registrar Movimiento
                  </button>
                </div>
              </form>

              <!-- LISTA DE GASTOS Y SUELDOS REGISTRADOS -->
              <div class="border border-slate-200 rounded-xl overflow-hidden">
                <div class="bg-slate-100 px-3 py-2 text-[11px] font-extrabold uppercase text-slate-600 flex justify-between">
                  <span>Historial de Gastos, Sueldos y Movimientos</span>
                  <span>${state.cashMovements.length} registros</span>
                </div>
                <div class="max-h-72 overflow-y-auto divide-y divide-slate-100 text-xs">
                  ${state.cashMovements.length === 0 ? `
                    <p class="text-slate-400 text-center py-6">Aún no has registrado sueldos ni gastos hoy.</p>
                  ` : state.cashMovements.map(m => {
                    const badgeColor =
                      m.category === 'Sueldos / Nómina' ? 'bg-purple-100 text-purple-800' :
                      m.category === 'Ingreso Adicional' ? 'bg-emerald-100 text-emerald-800' :
                      m.category === 'Retiro Dueño' ? 'bg-blue-100 text-blue-800' :
                      'bg-rose-100 text-rose-800';
                    return `
                      <div class="flex flex-wrap justify-between items-center gap-2 p-3 hover:bg-slate-50">
                        <div>
                          <span class="px-2 py-0.5 rounded-full text-[10px] font-extrabold ${badgeColor}">${m.category}</span>
                          <span class="font-bold text-slate-900 ml-1.5">${m.concept}</span>
                          <div class="text-[11px] text-slate-400 mt-0.5">
                            ${m.date || ''} ${m.time} • ${m.paidFromDrawer ? 'Afecta efectivo en caja' : 'Pago externo / transferencia'}
                          </div>
                        </div>
                        <div class="flex items-center gap-2">
                          <span class="font-black text-sm ${m.category === 'Ingreso Adicional' ? 'text-emerald-700' : 'text-rose-700'}">
                            ${m.category === 'Ingreso Adicional' ? '+' : '-'}${fmt(m.amount)}
                          </span>
                          <button onclick="deleteCashMovement(${m.id})" class="text-slate-400 hover:text-rose-600 font-bold px-1.5" title="Eliminar registro">✕</button>
                        </div>
                      </div>
                    `;
                  }).join('')}
                </div>
              </div>
            </div>

            <!-- ARQUEO DE EFECTIVO EN CAJA FÍSICA -->
            <div class="lg:col-span-5 bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4">
              <div class="flex justify-between items-center">
                <div>
                  <h2 class="font-extrabold text-[#081736] text-base">Arqueo de Efectivo en Caja</h2>
                  <span class="text-xs font-bold ${state.cashOpen ? 'text-emerald-600' : 'text-rose-600'}">
                    Estado: ${state.cashOpen ? 'CAJA ABIERTA' : 'CAJA CERRADA'}
                  </span>
                </div>
                <button onclick="toggleCashRegister()"
                  class="px-4 py-2 rounded-xl text-xs font-extrabold ${
                    state.cashOpen ? 'bg-rose-600 text-white' : 'bg-emerald-600 text-white'
                  }">
                  ${state.cashOpen ? 'Cerrar Caja' : '+ Abrir Caja'}
                </button>
              </div>

              <div class="space-y-2 text-xs border-t border-b border-slate-100 py-3">
                <div class="flex justify-between"><span>Fondo inicial en efectivo:</span><b>${fmt(state.openingFund)}</b></div>
                <div class="flex justify-between text-emerald-700"><span>+ Ventas cobradas en Efectivo:</span><b>${fmt(cashSales)}</b></div>
                <div class="flex justify-between text-slate-500"><span>Ventas Tarjeta / Transferencia (banco):</span><b>${fmt(cardSales + transferSales)}</b></div>
                <div class="flex justify-between text-blue-700"><span>+ Ingresos adicionales a caja:</span><b>${fmt(drawerIn)}</b></div>
                <div class="flex justify-between text-rose-700"><span>- Gastos / Sueldos pagados de caja:</span><b>-${fmt(drawerOut)}</b></div>
                <div class="flex justify-between text-base font-black text-[#081736] pt-2 border-t border-slate-200">
                  <span>Efectivo físico esperado en caja:</span><span>${fmt(expectedCash)}</span>
                </div>
              </div>

              <div class="bg-slate-50 p-3 rounded-xl text-[11px] text-slate-600 space-y-1">
                <div class="font-bold text-slate-800">💡 Consejo de control:</div>
                <p>Cuando pagues el sueldo del turno o compres gas/insumos con billetes de la caja, deja marcada la casilla <b>"El dinero salió de la caja física"</b> para que tu corte de efectivo cuadre al centavo.</p>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderPrinterTab() {
      const sampleOrder = state.lastTicket || {
        id: 1001,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        serviceType: 'Comer aquí',
        table: 'Barra 1',
        paymentMethod: 'Efectivo',
        items: [
          { name: 'Hamburguesas (Arrachera y Sirloin)', qty: 1, price: 90 },
          { name: 'Orden de Papas', qty: 1, price: 50 }
        ],
        totalSale: 140,
        paid: 200,
        change: 60,
        note: 'Ticket de prueba MP58C6'
      };

      return `
        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm max-w-2xl mx-auto space-y-4">
          <div class="flex items-center justify-between">
            <div>
              <h2 class="font-extrabold text-[#081736] text-lg">Configuración Impresora Térmica MP58C6 (58mm)</h2>
              <p class="text-xs text-slate-500">Estado actual: <b>${state.printerStatus}</b></p>
            </div>
            <button onclick="connectBluetoothMP58C6()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-4 py-2.5 rounded-xl">
              🔗 Vincular Bluetooth MP58C6
            </button>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 text-xs">
            <div class="p-3.5 rounded-xl bg-slate-50 border border-slate-200 space-y-2">
              <div class="font-extrabold text-[#081736]">1. Bluetooth Directo (Chrome/Edge)</div>
              <p class="text-slate-600">Conecta directo desde navegador HTTPS (como GitHub Pages) usando comandos ESC/POS.</p>
              <button onclick="printBluetoothESCPOS(${JSON.stringify(sampleOrder).replace(/"/g, '&quot;')})"
                class="w-full bg-blue-600 text-white font-bold py-2 rounded-lg">Probar BT Directo</button>
            </div>
            <div class="p-3.5 rounded-xl bg-slate-50 border border-slate-200 space-y-2">
              <div class="font-extrabold text-[#081736]">2. Celular Android (App RawBT)</div>
              <p class="text-slate-600">Ideal en teléfono Android teniendo instalada la app gratuita RawBT vinculada a la MP58C6.</p>
              <button onclick="printRawBT(${JSON.stringify(sampleOrder).replace(/"/g, '&quot;')})"
                class="w-full bg-amber-400 text-[#081736] font-bold py-2 rounded-lg">Probar RawBT</button>
            </div>
            <div class="p-3.5 rounded-xl bg-slate-50 border border-slate-200 space-y-2">
              <div class="font-extrabold text-[#081736]">3. Windows / Tablet (Driver 58mm)</div>
              <p class="text-slate-600">Usa el diálogo de impresión del sistema ajustado a papel térmico de 58mm sin márgenes.</p>
              <button onclick="printSystem58mm(${JSON.stringify(sampleOrder).replace(/"/g, '&quot;')})"
                class="w-full bg-[#081736] text-white font-bold py-2 rounded-lg">Imprimir Prueba 58mm</button>
            </div>
          </div>
        </div>
      `;
    }

    render();
  </script>
</body>
</html>
