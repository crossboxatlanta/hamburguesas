<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SHOWROOM The Twins — Punto de Venta y Cocina</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap");
    body { font-family: "Inter", sans-serif; }
    @media print {
      @page { size: 58mm auto; margin: 0; }
      body * { visibility: hidden !important; }
      #thermal-receipt-58mm, #thermal-receipt-58mm * { visibility: visible !important; }
      #thermal-receipt-58mm {
        position: fixed !important;
        left: 0 !important;
        top: 0 !important;
        width: 58mm !important;
        padding: 3mm 2.5mm !important;
        margin: 0 !important;
        background: #fff !important;
        color: #000 !important;
        font-family: "Courier New", Courier, monospace !important;
        font-size: 11px !important;
        line-height: 1.25 !important;
      }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen">
  <div id="app"></div>
  <div id="thermal-receipt-58mm" class="hidden print:block"></div>

  <script>
    const STORAGE_KEY = "the_twins_pos_v13";

    const BURGER_TYPES = ["Arrachera", "Sirloin"];
    const BURGER_OPTS = ["Con todo", "Sin lechuga", "Sin jitomate", "Sin cebolla", "Sin queso"];
    const WINGS_FLAVORS = ["BBQ", "Lemon Pepper", "Cajun", "Mango Habanero"];
    const MARQUESITA_OPTS = ["Queso", "Nutella", "Queso con nutella"];

    const DEFAULT_STATE = {
      role: "seller",
      adminPassword: "twins2026",
      showAuthModal: false,
      showChangePassModal: false,
      authError: "",
      pendingTab: null,
      cashOpen: true,
      openingFund: 500,
      cashMovements: [],
      activeTab: "pos",
      selectedCategory: "Todos",
      searchQuery: "",
      showQuickMenuEditorOnHome: false,
      serviceType: "Comer aquí",
      orderName: "",
      paymentMethod: "Efectivo",
      amountPaid: "",
      orderNote: "",
      cart: [],
      lastTicket: null,
      lastKitchenTicket: null,
      printerStatus: "Desconectada — Lista para vincular por Bluetooth",
      printerDeviceName: "",
      homeTitle: "SHOWROOM The Twins",
      homeSubtitle: "ESPACIO COLABORATIVO PARA EMPRENDEDORES",
      showHomeDesc: true,
      showHomeStock: true,
      optionModalProdId: null,
      optBurgerType: "Arrachera",
      optBurgerExtras: ["Con todo"],
      optWingFlavor: "BBQ",
      optMarquesita: "Queso",
      optJarritoFlavor: null,
      products: [
        { id: "P1", kind: "standard", name: "Banderillas", category: "Antojitos", costPrice: 28, price: 65, stock: 30, infinite: false, desc: "Crujientes con aderezos" },
        { id: "P2", kind: "standard", name: "Orden de Papas", category: "Snacks", costPrice: 20, price: 50, stock: 40, infinite: false, desc: "Papas a la francesa doradas" },
        { id: "P3", kind: "ramen", name: "Ramen", category: "Especiales", costPrice: 38, price: 85, stock: 20, infinite: false, desc: "Precio y costo ajustables según preparación" },
        { id: "P4", name: "Marquesitas", kind: "marquesita", category: "Postres", costPrice: 12, price: 30, stock: 35, infinite: false, desc: "Elige: Queso, Nutella o Queso con nutella" },
        { id: "P5", name: "Hamburguesas", kind: "burger", category: "Platillos", costPrice: 45, price: 90, stock: 25, infinite: false, desc: "Arrachera o Sirloin • Con todo o sin ingredientes" },
        { id: "P6", name: "Orden de Alitas", kind: "wings", category: "Platillos", costPrice: 46, price: 90, stock: 25, infinite: false, desc: "Sabores: BBQ, Lemon Pepper, Cajun, Mango Habanero" },
        { id: "P7", name: "Coca", kind: "coca", category: "Refrescos", costPrice: 11, price: 25, stock: 24, infinite: false, desc: "Refresco de cola frío" },
        {
          id: "P8",
          name: "Jarrito",
          kind: "jarrito",
          category: "Refrescos",
          costPrice: 12,
          price: 25,
          stock: 0,
          infinite: false,
          desc: "Sabores disponibles por pieza",
          flavors: [
            { name: "Piña", stock: 8 },
            { name: "Mandarina", stock: 8 },
            { name: "Tamarindo", stock: 6 },
            { name: "Limón", stock: 6 },
            { name: "Uva", stock: 6 }
          ]
        },
        { id: "P9", name: "Extra Queso / Tocino", kind: "standard", category: "Extras", costPrice: 8, price: 20, stock: 0, infinite: true, desc: "Complemento adicional" },
        { id: "P10", name: "Aderezo Extra", kind: "standard", category: "Extras", costPrice: 6, price: 15, stock: 0, infinite: true, desc: "Aderezo extra a elegir" }
      ],
      orders: [],
      inventoryLogs: [
        {
          date: new Date().toLocaleDateString("es-MX"),
          time: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }),
          action: "Inicio",
          product: "Catálogo inicial",
          detail: "Menú, Ramen variable y Aderezo Extra ($15) cargados",
          user: "Sistema"
        }
      ],
      liveLogs: [
        {
          time: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }),
          msg: "SHOWROOM The Twins POS y Cocina listo"
        }
      ]
    };

    let state = loadState();
    let btDevice = null;
    let btChar = null;

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          return Object.assign({}, DEFAULT_STATE, parsed, {
            showAuthModal: false,
            showChangePassModal: false,
            optionModalProdId: null,
            authError: "",
            pendingTab: null,
            cart: parsed.cart || [],
            cashMovements: parsed.cashMovements || [],
            inventoryLogs: parsed.inventoryLogs || DEFAULT_STATE.inventoryLogs,
            liveLogs: parsed.liveLogs || DEFAULT_STATE.liveLogs
          });
        }
      } catch (err) {}
      return JSON.parse(JSON.stringify(DEFAULT_STATE));
    }

    function saveState() {
      try {
        const copy = Object.assign({}, state, {
          showAuthModal: false,
          showChangePassModal: false,
          optionModalProdId: null,
          authError: "",
          pendingTab: null
        });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(copy));
      } catch (err) {}
    }

    function fmt(n) {
      return "$" + Number(n || 0).toFixed(2);
    }

    function esc(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function getTotalStock(prod) {
      if (prod.kind === "jarrito" && Array.isArray(prod.flavors)) {
        return prod.flavors.reduce((s, f) => s + Number(f.stock || 0), 0);
      }
      return Number(prod.stock || 0);
    }

    function addLiveLog(msg) {
      const time = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
      state.liveLogs.unshift({ time, msg });
      if (state.liveLogs.length > 60) state.liveLogs.pop();
    }

    function addInvLog(action, product, detail) {
      const now = new Date();
      state.inventoryLogs.unshift({
        date: now.toLocaleDateString("es-MX"),
        time: now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" }),
        action,
        product,
        detail,
        user: state.role === "admin" ? "Administrador" : "Vendedor"
      });
      if (state.inventoryLogs.length > 150) state.inventoryLogs.pop();
    }

    function getFinancials() {
      const valid = state.orders.filter(o => o.status !== "Cancelado");
      const sales = valid.reduce((s, o) => s + o.totalSale, 0);
      const cost = valid.reduce((s, o) => s + o.totalCost, 0);
      const grossProfit = sales - cost;
      const payroll = state.cashMovements
        .filter(m => m.category === "Sueldos / Nómina")
        .reduce((s, m) => s + m.amount, 0);
      const expenses = state.cashMovements
        .filter(m => m.category === "Gasto Operativo / Insumos" || m.category === "Servicios / Renta")
        .reduce((s, m) => s + m.amount, 0);
      const extraIn = state.cashMovements
        .filter(m => m.category === "Ingreso Adicional")
        .reduce((s, m) => s + m.amount, 0);
      const netFinal = grossProfit + extraIn - payroll - expenses;
      return {
        count: valid.length,
        sales,
        cost,
        grossProfit,
        payroll,
        expenses,
        extraIn,
        netFinal
      };
    }

    // --- ROL Y CONTRASEÑA ---
    function openAuth(tabKey) {
      state.showAuthModal = true;
      state.authError = "";
      state.pendingTab = tabKey || null;
      render();
      setTimeout(() => {
        const el = document.getElementById("passInput");
        if (el) el.focus();
      }, 40);
    }

    function closeAuth() {
      state.showAuthModal = false;
      state.authError = "";
      state.pendingTab = null;
      render();
    }

    function handleAuthSubmit(e) {
      e.preventDefault();
      const el = document.getElementById("passInput");
      const val = el ? el.value : "";
      if (val === state.adminPassword) {
        state.role = "admin";
        state.showAuthModal = false;
        state.authError = "";
        if (state.pendingTab) {
          state.activeTab = state.pendingTab;
          state.pendingTab = null;
        }
        addLiveLog("Modo Administrador activado");
        saveState();
        render();
      } else {
        state.authError = "Contraseña incorrecta.";
        render();
      }
    }

    function setSellerMode() {
      state.role = "seller";
      if (state.activeTab === "inventory" || state.activeTab === "cash" || state.activeTab === "homesetup") {
        state.activeTab = "pos";
      }
      addLiveLog("Modo Vendedor activado");
      saveState();
      render();
    }

    function openChangePass() {
      if (state.role !== "admin") return;
      state.showChangePassModal = true;
      state.authError = "";
      render();
    }

    function closeChangePass() {
      state.showChangePassModal = false;
      state.authError = "";
      render();
    }

    function handleChangePass(e) {
      e.preventDefault();
      const f = e.target;
      const cur = f.curPass.value;
      const nw = f.newPass.value.trim();
      const cf = f.confPass.value.trim();
      if (cur !== state.adminPassword) {
        state.authError = "La contraseña actual no es correcta.";
        render();
        return;
      }
      if (nw.length < 4) {
        state.authError = "Usa al menos 4 caracteres.";
        render();
        return;
      }
      if (nw !== cf) {
        state.authError = "Las contraseñas no coinciden.";
        render();
        return;
      }
      state.adminPassword = nw;
      state.showChangePassModal = false;
      state.authError = "";
      addLiveLog("Contraseña de Administrador actualizada");
      saveState();
      render();
      alert("Contraseña actualizada.");
    }

    function goTab(tabKey) {
      const adminOnly = ["inventory", "cash", "homesetup"];
      if (adminOnly.includes(tabKey) && state.role !== "admin") {
        openAuth(tabKey);
        return;
      }
      state.activeTab = tabKey;
      saveState();
      render();
    }

    // --- SELECCIÓN DE PRODUCTOS Y OPCIONES ---
    function onProductClick(prodId) {
      const p = state.products.find(x => x.id === prodId);
      if (!p) return;

      if (p.kind === "burger" || p.kind === "wings" || p.kind === "marquesita" || p.kind === "jarrito") {
        if (p.kind !== "jarrito" && !p.infinite && p.stock <= 0) {
          alert("Producto agotado.");
          return;
        }
        if (p.kind === "jarrito") {
          const avail = (p.flavors || []).filter(f => f.stock > 0);
          if (avail.length === 0) {
            alert("No quedan Jarritos disponibles de ningún sabor.");
            return;
          }
          state.optJarritoFlavor = avail[0].name;
        }
        state.optionModalProdId = p.id;
        state.optBurgerType = "Arrachera";
        state.optBurgerExtras = ["Con todo"];
        state.optWingFlavor = "BBQ";
        state.optMarquesita = "Queso";
        render();
        return;
      }

      addCartItemDirect(p, p.name, "");
    }

    function closeOptionModal() {
      state.optionModalProdId = null;
      render();
    }

    function toggleBurgerExtra(opt) {
      if (opt === "Con todo") {
        state.optBurgerExtras = ["Con todo"];
        render();
        return;
      }
      let next = state.optBurgerExtras.filter(x => x !== "Con todo");
      if (next.includes(opt)) {
        next = next.filter(x => x !== opt);
      } else {
        next.push(opt);
      }
      if (next.length === 0) next = ["Con todo"];
      state.optBurgerExtras = next;
      render();
    }

    function confirmOptionModal() {
      const p = state.products.find(x => x.id === state.optionModalProdId);
      if (!p) return;

      if (p.kind === "burger") {
        const detail = `${state.optBurgerType} • ${state.optBurgerExtras.join(", ")}`;
        addCartItemDirect(p, `${p.name} (${state.optBurgerType})`, detail, null);
      } else if (p.kind === "wings") {
        const detail = `Sabor ${state.optWingFlavor}`;
        addCartItemDirect(p, `${p.name} (${state.optWingFlavor})`, detail, null);
      } else if (p.kind === "marquesita") {
        const detail = `Relleno: ${state.optMarquesita}`;
        addCartItemDirect(p, `${p.name} (${state.optMarquesita})`, detail, null);
      } else if (p.kind === "jarrito") {
        const fl = (p.flavors || []).find(f => f.name === state.optJarritoFlavor);
        if (!fl || fl.stock <= 0) {
          alert("Ese sabor de Jarrito ya no tiene existencias.");
          return;
        }
        addCartItemDirect(p, `Jarrito ${fl.name}`, `Sabor: ${fl.name}`, fl.name);
      }

      state.optionModalProdId = null;
      saveState();
      render();
    }

    function getCartReservedQty(prodId, flavorName) {
      return state.cart
        .filter(it => it.prodId === prodId && (!flavorName || it.flavorName === flavorName))
        .reduce((s, it) => s + it.qty, 0);
    }

    function addCartItemDirect(p, displayName, detail, flavorName) {
      if (p.kind === "jarrito" && flavorName) {
        const fl = (p.flavors || []).find(f => f.name === flavorName);
        if (!fl) return;
        const reserved = getCartReservedQty(p.id, flavorName);
        if (reserved + 1 > fl.stock) {
          alert(`Solo quedan ${fl.stock} Jarritos de ${flavorName}.`);
          return;
        }
      } else if (!p.infinite) {
        const reserved = getCartReservedQty(p.id, null);
        if (reserved + 1 > p.stock) {
          alert("No hay más stock disponible de " + p.name);
          return;
        }
      }

      const found = state.cart.find(x => x.prodId === p.id && x.displayName === displayName && x.detail === detail && p.kind !== "ramen");
      if (found) {
        found.qty += 1;
      } else {
        state.cart.push({
          prodId: p.id,
          kind: p.kind || "standard",
          baseName: p.name,
          displayName: displayName,
          detail: detail || "",
          flavorName: flavorName || null,
          costPrice: Number(p.costPrice),
          price: Number(p.price),
          qty: 1
        });
      }
      saveState();
      render();
    }

    function updateCartRamenPrice(idx, newPrice) {
      const it = state.cart[idx];
      if (!it) return;
      it.price = Math.max(0, parseFloat(newPrice) || 0);
      saveState();
      render();
    }

    function updateCartRamenCost(idx, newCost) {
      const it = state.cart[idx];
      if (!it) return;
      it.costPrice = Math.max(0, parseFloat(newCost) || 0);
      saveState();
      render();
    }

    function changeQty(idx, delta) {
      const it = state.cart[idx];
      if (!it) return;
      const p = state.products.find(x => x.id === it.prodId);
      const next = it.qty + delta;
      if (next <= 0) {
        state.cart.splice(idx, 1);
      } else {
        if (p && p.kind === "jarrito" && it.flavorName) {
          const fl = (p.flavors || []).find(f => f.name === it.flavorName);
          if (fl && next > fl.stock) {
            alert(`Solo hay ${fl.stock} disponibles de ${it.flavorName}.`);
            return;
          }
        } else if (p && !p.infinite && next > p.stock) {
          alert("Stock máximo alcanzado.");
          return;
        }
        it.qty = next;
      }
      saveState();
      render();
    }

    function checkoutOrder() {
      if (!state.cashOpen) {
        alert("La caja está cerrada.");
        return;
      }
      if (state.cart.length === 0) return;

      const cleanOrderName = (state.orderName || "").trim() || ("Orden #" + (1000 + state.orders.length + 1));
      const totalSale = state.cart.reduce((s, i) => s + i.price * i.qty, 0);
      const totalCost = state.cart.reduce((s, i) => s + i.costPrice * i.qty, 0);
      const paid = state.paymentMethod === "Efectivo" ? (parseFloat(state.amountPaid) || totalSale) : totalSale;
      if (state.paymentMethod === "Efectivo" && paid < totalSale) {
        alert("El monto recibido es menor al total.");
        return;
      }
      const change = state.paymentMethod === "Efectivo" ? Math.max(0, paid - totalSale) : 0;
      const profit = totalSale - totalCost;
      const folio = 1000 + state.orders.length + 1;

      state.cart.forEach(item => {
        const p = state.products.find(x => x.id === item.prodId);
        if (!p) return;
        if (p.kind === "jarrito" && item.flavorName) {
          const fl = (p.flavors || []).find(f => f.name === item.flavorName);
          if (fl) {
            const prev = fl.stock;
            fl.stock = Math.max(0, fl.stock - item.qty);
            addInvLog("Salida Jarrito", `Jarrito ${fl.name}`, `${cleanOrderName} (#${folio}): -${item.qty} (${prev} -> ${fl.stock})`);
          }
        } else if (!p.infinite) {
          const prev = p.stock;
          p.stock = Math.max(0, p.stock - item.qty);
          addInvLog("Salida por Venta", p.name, `${cleanOrderName} (#${folio}): -${item.qty} (${prev} -> ${p.stock})`);
        }
      });

      const order = {
        id: folio,
        orderName: cleanOrderName,
        time: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }),
        items: JSON.parse(JSON.stringify(state.cart)),
        serviceType: state.serviceType,
        paymentMethod: state.paymentMethod,
        totalSale,
        totalCost,
        profit,
        paid,
        change,
        note: state.orderNote,
        status: "En cocina"
      };

      state.orders.unshift(order);
      state.lastTicket = order;
      state.lastKitchenTicket = order;
      state.cart = [];
      state.orderName = "";
      state.amountPaid = "";
      state.orderNote = "";
      addLiveLog(`${cleanOrderName} (#${folio}) enviada a cocina por ${fmt(totalSale)}`);
      saveState();
      render();
    }

    function markOrderDelivered(orderId) {
      const ord = state.orders.find(o => o.id === orderId);
      if (ord) {
        ord.status = "Entregado";
      }
      if (state.lastTicket && state.lastTicket.id === orderId) {
        state.lastTicket.status = "Entregado";
      }
      if (state.lastKitchenTicket && state.lastKitchenTicket.id === orderId) {
        state.lastKitchenTicket.status = "Entregado";
      }
      if (state.lastKitchenTicket && state.lastKitchenTicket.id === orderId) {
        state.lastKitchenTicket.status = "Entregado";
      }
      if (!ord && state.lastKitchenTicket && state.lastKitchenTicket.id === orderId) {
        state.lastKitchenTicket.status = "Entregado";
      }
      addLiveLog(`Orden #${orderId} marcada como ENTREGADO`);
      saveState();
      render();
    }

    // --- PROGRAMACIÓN BLUETOOTH ESC/POS (COMANDA Y TICKET) + RAWBT + 58MM ---
    function escPosInitAndAlign(alignCenter) {
      return new Uint8Array([0x1B, 0x40, 0x1B, 0x61, alignCenter ? 0x01 : 0x00]);
    }

    function escPosBold(on) {
      return new Uint8Array([0x1B, 0x45, on ? 0x01 : 0x00]);
    }

    function escPosFeedAndCut() {
      return new Uint8Array([0x0A, 0x0A, 0x0A, 0x0A, 0x1D, 0x56, 0x42, 0x00]);
    }

    function getCustomerReceiptText(order) {
      const sep = "--------------------------------\n";
      let t = `${state.homeTitle.toUpperCase()}\n`;
      t += "ESPACIO COLABORATIVO EMPREND.\n";
      t += sep;
      t += `Orden: ${order.orderName}\n`;
      t += `Folio: #${order.id}  Hora: ${order.time}\n`;
      t += `Servicio: ${order.serviceType}\n`;
      t += `Pago: ${order.paymentMethod}\n`;
      t += sep;
      order.items.forEach(i => {
        t += `${i.qty}x ${i.displayName}\n`;
        if (i.detail) t += `   * ${i.detail}\n`;
        t += `   ${fmt(i.price)} c/u    ${fmt(i.price * i.qty)}\n`;
      });
      if (order.note) t += `Nota: ${order.note}\n`;
      t += sep;
      t += `TOTAL:            ${fmt(order.totalSale)}\n`;
      if (order.paymentMethod === "Efectivo") {
        t += `RECIBIDO:         ${fmt(order.paid)}\n`;
        t += `CAMBIO:           ${fmt(order.change)}\n`;
      }
      t += sep;
      t += "GRACIAS POR TU COMPRA!\n";
      return t;
    }

    function getKitchenReceiptText(order) {
      const sep = "================================\n";
      const dash = "--------------------------------\n";
      let t = `COMANDA COCINA - ${state.homeTitle.toUpperCase()}\n`;
      t += sep;
      t += `ORDEN: ${order.orderName.toUpperCase()}\n`;
      t += `Folio: #${order.id}  Hora: ${order.time}\n`;
      t += `Tipo: ${order.serviceType}\n`;
      t += dash;
      t += "PREPARAR Y ENTREGAR:\n\n";
      order.items.forEach(i => {
        t += `[ ] ${i.qty}x ${i.displayName}\n`;
        if (i.detail) t += `    -> ${i.detail}\n`;
      });
      if (order.note) {
        t += dash;
        t += `INDICACION: ${order.note}\n`;
      }
      t += sep;
      return t;
    }

    function printCustomer58System(order) {
      if (!order) return;
      const el = document.getElementById("thermal-receipt-58mm");
      const rows = order.items.map(i =>
        `<div style="margin-bottom:4px;">
          <div><b>${i.qty}x ${esc(i.displayName)}</b></div>
          ${i.detail ? `<div style="font-size:10px;">* ${esc(i.detail)}</div>` : ""}
          <div style="display:flex;justify-content:space-between;"><span>${fmt(i.price)} c/u</span><b>${fmt(i.price * i.qty)}</b></div>
        </div>`
      ).join("");
      const cashRow = order.paymentMethod === "Efectivo"
        ? `<div style="display:flex;justify-content:space-between;"><span>Cambio:</span><b>${fmt(order.change)}</b></div>`
        : "";
      el.innerHTML =

    async function resolveWritableCharacteristic(device) {
      const server = await device.gatt.connect();
      const commonServices = [
        "000018f0-0000-1000-8000-00805f9b34fb",
        "49535343-fe7d-4ae5-8fa9-9fafd205e455",
        "0000ffe0-0000-1000-8000-00805f9b34fb",
        "0000ff00-0000-1000-8000-00805f9b34fb",
        "e7810a71-73ae-499d-8c15-faa9aef0c3f2"
      ];
      let services = [];
      try {
        services = await server.getPrimaryServices();
      } catch (e) {
        for (const uuid of commonServices) {
          try {
            const s = await server.getPrimaryService(uuid);
            if (s) services.push(s);
          } catch (_) {}
        }
      }
      for (const s of services) {
        try {
          const chars = await s.getCharacteristics();
          for (const c of chars) {
            if (c.properties.write || c.properties.writeWithoutResponse) {
              return c;
            }
          }
        } catch (_) {}
      }
      return null;
    }

    async function connectBT() {
      if (!navigator.bluetooth) {
        alert("Este navegador no soporta Web Bluetooth directo. Usa Chrome o Edge en Android/Windows, o usa el botón RawBT en Android.");
        return;
      }
      try {
        state.printerStatus = "Buscando impresora Bluetooth...";
        render();
        const device = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: [
            "000018f0-0000-1000-8000-00805f9b34fb",
            "49535343-fe7d-4ae5-8fa9-9fafd205e455",
            "0000ffe0-0000-1000-8000-00805f9b34fb",
            "0000ff00-0000-1000-8000-00805f9b34fb",
            "e7810a71-73ae-499d-8c15-faa9aef0c3f2"
          ]
        });
        btDevice = device;
        device.addEventListener("gattserverdisconnected", function() {
          btChar = null;
          state.printerStatus = `Desconectada (${state.printerDeviceName || "Bluetooth"}) — Toca Reconectar`;
          render();
        });
        const char = await resolveWritableCharacteristic(device);
        if (!char) {
          state.printerStatus = "Vinculada pero sin canal de escritura BLE — Usa RawBT o 58mm";
          alert("La impresora se emparejó pero su perfil Bluetooth es Classic/SPP. En Android usa el botón RawBT o en PC/Tablet usa Imprimir 58mm.");
          render();
          return;
        }
        btChar = char;
        state.printerDeviceName = device.name || "Impresora 58mm";
        state.printerStatus = `Conectada: ${state.printerDeviceName}`;
        addLiveLog(`Impresora Bluetooth conectada: ${state.printerDeviceName}`);
        saveState();
        render();
      } catch (err) {
        state.printerStatus = "No conectada — Revisa Bluetooth encendido o usa RawBT / 58mm";
        render();
      }
    }

    function buildEscPosPayload(plainText) {
      const encoder = new TextEncoder();
      const head = escPosInitAndAlign(false);
      const boldOn = escPosBold(true);
      const boldOff = escPosBold(false);
      const bodyBytes = encoder.encode(plainText);
      const tail = escPosFeedAndCut();

      const totalLen = head.length + boldOn.length + bodyBytes.length + boldOff.length + tail.length;
      const out = new Uint8Array(totalLen);
      let offset = 0;
      out.set(head, offset); offset += head.length;
      out.set(boldOn, offset); offset += boldOn.length;
      out.set(bodyBytes, offset); offset += bodyBytes.length;
      out.set(boldOff, offset); offset += boldOff.length;
      out.set(tail, offset);
      return out;
    }

    function writeChunkSafe(ch, chunk) {
      if (ch.properties.writeWithoutResponse && typeof ch.writeValueWithoutResponse === "function") {
        return ch.writeValueWithoutResponse(chunk);
      }
      return ch.writeValue(chunk);
    }

    async function sendTextBT(txt, label) {
      try {
        if (!btChar && btDevice) {
          btChar = await resolveWritableCharacteristic(btDevice);
        }
        if (!btChar) {
          await connectBT();
          if (!btChar) return;
        }
        const payload = buildEscPosPayload(txt);
        const chunkSize = 120;
        for (let i = 0; i < payload.length; i += chunkSize) {
          const slice = payload.slice(i, i + chunkSize);
          await writeChunkSafe(btChar, slice);
          await new Promise(r => setTimeout(r, 25));
        }
        addLiveLog(`${label} enviada por Bluetooth`);
        saveState();
        render();
      } catch (err) {
        btChar = null;
        state.printerStatus = "Error al enviar por BT — Reconecta o usa RawBT / 58mm";
        render();
        alert("No se pudo enviar por Bluetooth directo. Si usas Android, prueba el botón RawBT; si usas PC/Tablet, usa Imprimir 58mm.");
      }
    }

    function editProd(id, field, val) {
      const p = state.products.find(x => x.id === id);
      if (!p) return;
      if (field === "name") {
        const clean = String(val).trim();
        if (!clean || clean === p.name) return;
        const old = p.name;
        p.name = clean;
        addInvLog("Cambio de Nombre", clean, `"${old}" -> "${clean}"`);
      } else if (field === "category") {
        p.category = String(val).trim() || p.category;
        addInvLog("Cambio de Categoría", p.name, `Categoría: ${p.category}`);
      } else if (field === "costPrice") {
        const oldC = p.costPrice;
        p.costPrice = Math.max(0, parseFloat(val) || 0);
        addInvLog("Cambio de Costo", p.name, `${fmt(oldC)} -> ${fmt(p.costPrice)}`);
      } else if (field === "price") {
        const oldP = p.price;
        p.price = Math.max(0, parseFloat(val) || 0);
        addInvLog("Cambio de Precio", p.name, `${fmt(oldP)} -> ${fmt(p.price)}`);
      } else if (field === "stock") {
        const oldS = p.stock;
        p.stock = Math.max(0, parseInt(val) || 0);
        addInvLog("Ajuste de Stock", p.name, `${oldS} -> ${p.stock} uds`);
      } else if (field === "infinite") {
        p.infinite = Boolean(val);
        addInvLog("Stock Infinito", p.name, p.infinite ? "Activado (∞)" : "Desactivado");
      }
      saveState();
      render();
    }

                  </div>
                  ${kitchenTarget ? `
                    <span class="text-xs font-extrabold px-2.5 py-1 rounded-full ${kitchenTarget.status === "Entregado" ? "bg-emerald-100 text-emerald-800" : "bg-amber-100 text-amber-900"}">
                      ${esc(kitchenTarget.status || "En cocina")}
                    </span>
                  ` : ""}
                </div>

                ${!kitchenTarget ? `<p class="text-xs text-slate-400 py-8 text-center">Cobra una orden para generar su comanda de cocina.</p>` : `
                  <div class="bg-slate-50 p-4 rounded-xl border space-y-2 text-xs">
                    <div class="flex justify-between font-bold text-slate-700">
                      <span>Orden: <b class="text-[#081736]">${esc(kitchenTarget.orderName)}</b></span>
                      <span>Folio #${kitchenTarget.id} • ${kitchenTarget.time}</span>
                    </div>
                    <div class="text-slate-600">Servicio: <b>${esc(kitchenTarget.serviceType)}</b></div>
                    <div class="divide-y divide-slate-200 pt-2">
                      ${kitchenTarget.items.map(i => `
                        <div class="py-2">
                          <div class="font-black text-sm text-slate-900">• ${i.qty}x ${esc(i.displayName)}</div>
                          ${i.detail ? `<div class="text-xs font-bold text-amber-800 ml-3">→ ${esc(i.detail)}</div>` : ""}
                        </div>
                      `).join("")}
                    </div>
                    ${kitchenTarget.note ? `<div class="p-2 rounded bg-amber-100 text-amber-950 font-bold">Nota: ${esc(kitchenTarget.note)}</div>` : ""}
                  </div>

                  <div class="grid grid-cols-3 gap-2 text-xs font-bold">
                    <button onclick="printKitchen58System(kitchenTarget)" class="bg-[#081736] text-amber-400 py-2.5 rounded-lg">Imprimir Comanda 58mm</button>
                    <button onclick="printBT(kitchenTarget, true)" class="bg-blue-600 text-white py-2.5 rounded-lg">BT Directo Cocina</button>
                    <button onclick="printRaw(kitchenTarget, true)" class="bg-amber-400 text-[#081736] py-2.5 rounded-lg">RawBT Cocina</button>
                  </div>

                  <button onclick="markOrderDelivered(kitchenTarget.id)" class="w-full py-2.5 rounded-xl text-xs font-black ${kitchenTarget.status === "Entregado" ? "bg-emerald-100 text-emerald-800 border border-emerald-300" : "bg-emerald-600 hover:bg-emerald-700 text-white"}">
                    ${kitchenTarget.status === "Entregado" ? "✓ Entregado" : "✓ Marcar como Entregado"}
                  </button>
                `}
              </div>

              <div class="lg:col-span-6 bg-white p-4 rounded-2xl border space-y-2.5">
                <h2 class="font-black text-[#081736] text-base">Órdenes para Cocina</h2>
                ${state.orders.length === 0 ? `<p class="text-xs text-slate-400 py-6">Aún no hay órdenes registradas.</p>` :
                  state.orders.map(o => `
                    <div class="p-3 rounded-xl border bg-slate-50 text-xs space-y-1.5">
                      <div class="flex justify-between items-center gap-2">
                        <span class="font-black text-[#081736]">${esc(o.orderName)} (#${o.id})</span>
                        <span class="text-[11px] font-extrabold px-2.5 py-0.5 rounded-full ${o.status === "Entregado" ? "bg-emerald-100 text-emerald-800" : "bg-amber-100 text-amber-900"}">${esc(o.status)}</span>
                      </div>
                      <div class="text-slate-700 font-semibold">
                        ${o.items.map(i => `${i.qty}x ${esc(i.displayName)}${i.detail ? ` [${esc(i.detail)}]` : ""}`).join(" • ")}
                      </div>
                      <div class="pt-1 flex flex-wrap justify-end gap-1.5">
                        <button onclick="markOrderDelivered(${o.id})" class="bg-emerald-600 text-white px-3 py-1 rounded-lg font-bold">✓ Marcar como Entregado</button>
                        <button onclick="openKitchenForOrderId(${o.id})" class="bg-[#081736] text-amber-400 px-3 py-1 rounded-lg font-bold">Ver Comanda</button>
                        <button onclick="printBT(state.orders.find(function(x){return x.id===${o.id};}), true)" class="bg-blue-600 text-white px-3 py-1 rounded-lg font-bold">BT Cocina</button>
                      </div>
                    </div>
                  `).join("")}
              </div>
            </div>
          ` : ""}

          ${state.activeTab === "live" ? `
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-4">
              <div class="lg:col-span-7 bg-white p-4 rounded-2xl border space-y-2.5">
                <h2 class="font-black text-[#081736] text-base">Órdenes en Tiempo Real</h2>
                ${state.orders.length === 0 ? `<p class="text-xs text-slate-400 py-6">Sin órdenes todavía.</p>` :
                  state.orders.map(o => `
                    <div class="p-3 rounded-xl border bg-slate-50 text-xs flex flex-wrap justify-between items-center gap-2">
                      <div>
                        <b>${esc(o.orderName)}</b> (#${o.id}) • ${o.time} • <b>${fmt(o.totalSale)}</b>
                        <span class="ml-2 px-2 py-0.5 rounded-full text-[10px] font-extrabold ${o.status === "Entregado" ? "bg-emerald-100 text-emerald-800" : "bg-amber-100 text-amber-900"}">${esc(o.status)}</span>
                      </div>
                      <div class="flex gap-1.5">
                        <button onclick="markOrderDelivered(${o.id})" class="bg-emerald-600 text-white px-2.5 py-1 rounded font-bold">✓ Entregado</button>
                        <button onclick="openKitchenForOrderId(${o.id})" class="bg-[#081736] text-amber-400 px-2.5 py-1 rounded font-bold">Comanda</button>
                        <button onclick="printCustomer58System(state.orders.find(function(x){return x.id===${o.id};}))" class="bg-slate-800 text-white px-2.5 py-1 rounded font-bold">Ticket</button>
                      </div>
                    </div>
                  `).join("")}
              </div>
              <div class="lg:col-span-5 bg-[#081736] text-white p-4 rounded-2xl space-y-2 text-xs">
                <h2 class="font-black text-amber-400 text-base">Bitácora</h2>
                ${state.liveLogs.map(l => `<div class="bg-white/10 p-2 rounded">[${l.time}] ${esc(l.msg)}</div>`).join("")}
              </div>
            </div>
          ` : ""}

          ${state.activeTab === "inventory" && isAdmin ? `
            <div class="space-y-4">
              <div class="bg-white p-4 rounded-2xl border space-y-3">
                <h2 class="font-black text-[#081736] text-sm">Menú, Precios, Costos y Stock</h2>
                ${renderMenuFullEditorTable()}
              </div>
              <div class="bg-white p-4 rounded-2xl border space-y-2">
                <h3 class="font-black text-[#081736] text-sm">Registro de Modificaciones de Inventario</h3>
                <div class="max-h-60 overflow-y-auto divide-y text-xs">
                  ${state.inventoryLogs.map(l => `
                    <div class="py-1.5 flex flex-wrap justify-between gap-2">
                      <span class="text-slate-400">${esc(l.date)} ${esc(l.time)}</span>
                      <b>${esc(l.action)}</b>
                      <span>${esc(l.product)}: ${esc(l.detail)}</span>
                    </div>
                  `).join("")}
                </div>
              </div>
            </div>
          ` : ""}

          ${state.activeTab === "cash" && isAdmin ? `
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-4">
              <div class="lg:col-span-6 bg-white p-4 rounded-2xl border space-y-2.5 text-xs">
                <h2 class="font-black text-[#081736] text-base">Ganancia Después de Costos, Sueldos y Gastos</h2>
                <div class="flex justify-between"><span>Ventas Totales:</span><b>${fmt(fin.sales)}</b></div>
                <div class="flex justify-between"><span>(-) Costo Insumos:</span><b>-${fmt(fin.cost)}</b></div>
                <div class="flex justify-between text-emerald-700 font-bold"><span>Ganancia de Ventas:</span><span>${fmt(fin.grossProfit)}</span></div>
                <div class="flex justify-between text-purple-800 font-bold"><span>(-) Sueldos / Nómina:</span><span>-${fmt(fin.payroll)}</span></div>
                <div class="flex justify-between text-rose-700 font-bold"><span>(-) Otros Gastos:</span><span>-${fmt(fin.expenses)}</span></div>
                <div class="flex justify-between text-base font-black pt-2 border-t text-[#081736]"><span>GANANCIA REAL FINAL:</span><span>${fmt(fin.netFinal)}</span></div>
              </div>
              <div class="lg:col-span-6 bg-white p-4 rounded-2xl border space-y-3 text-xs">
                <h2 class="font-black text-[#081736] text-base">Registrar Gastos y Sueldos</h2>
                <form onsubmit="createMovement(event)" class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                  <select name="mCat" class="border rounded-lg px-2 py-2 font-bold">
                    <option>Sueldos / Nómina</option>
                    <option>Gasto Operativo / Insumos</option>
                    <option>Servicios / Renta</option>
                    <option>Ingreso Adicional</option>
                  </select>
                  <input name="mConcept" required placeholder="Concepto / Empleado" class="border rounded-lg px-2.5 py-2" />
                  <div class="flex gap-1.5">
                    <input name="mAmount" type="number" step="0.01" required placeholder="$" class="w-full border rounded-lg px-2 py-2" />
                    <button type="submit" class="bg-[#081736] text-amber-400 font-black px-3 rounded-lg">+</button>
                  </div>
                  <label class="sm:col-span-3 flex items-center gap-1.5"><input name="mDrawer" type="checkbox" checked /> Afecta caja física</label>
                </form>
                <div class="divide-y max-h-48 overflow-y-auto">
                  ${state.cashMovements.map(m => `
                    <div class="py-2 flex justify-between"><span><b>${esc(m.category)}</b>: ${esc(m.concept)}</span><span class="font-bold">${fmt(m.amount)}</span></div>
                  `).join("")}
                </div>
              </div>
            </div>
          ` : ""}

          ${state.activeTab === "printer" ? `
            <div class="bg-white p-5 rounded-2xl border max-w-2xl mx-auto space-y-4 text-xs">
              <div class="flex flex-wrap justify-between items-center gap-2">
                <div>
                  <h2 class="font-black text-[#081736] text-base">Impresora Bluetooth 58mm (Comanda y Ticket)</h2>
                  <div class="text-slate-500">Estado: <b>${esc(state.printerStatus)}</b></div>
                </div>
                <button onclick="connectBT()" class="bg-blue-600 text-white font-bold px-4 py-2 rounded-xl">🔗 Vincular Impresora BT</button>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 font-bold">
                <button onclick="printBT(getSample(), true)" class="bg-emerald-600 text-white py-2.5 rounded-xl">🔵 Enviar Comanda Cocina por BT</button>
                <button onclick="printBT(getSample(), false)" class="bg-blue-600 text-white py-2.5 rounded-xl">🔵 Enviar Ticket Cliente por BT</button>
                <button onclick="printRaw(getSample(), true)" class="bg-amber-400 text-[#081736] py-2.5 rounded-xl">RawBT Cocina (Android)</button>
                <button onclick="printCustomer58System(getSample())" class="bg-[#081736] text-white py-2.5 rounded-xl">Imprimir Prueba 58mm</button>
              </div>
            </div>
          ` : ""}
        </main>
      `;
    }

    render();
  </script>
</body>
</html>
