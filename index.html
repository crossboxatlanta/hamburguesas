<body class="bg-slate-100 text-slate-900 min-h-screen">
  <div id="app"></div>
  <div id="thermal-receipt-58mm" class="hidden print:block"></div>

  <script>
    const PRESET_SUPABASE_URL = "https://trklrkfojohzezmzkhfu.supabase.co";
    const PRESET_SUPABASE_ANON_KEY = "";
    const SYNC_ROOM_ID = "the_twins_main";

    const STORAGE_KEY = "the_twins_pos_v30_cloud";
    const CLOUD_CFG_KEY = "the_twins_supabase_cfg_v1";

    const BURGER_TYPES = ["Arrachera", "Sirloin"];
    const BURGER_OPTS = ["Con todo", "Sin lechuga", "Sin jitomate", "Sin cebolla", "Sin queso"];
    const WINGS_FLAVORS = ["BBQ", "Lemon Pepper", "Cajun", "Mango Habanero"];
    const MARQUESITA_OPTS = ["Queso", "Nutella", "Queso con nutella"];

    const SQL_SETUP_SCRIPT = `create table if not exists public.twins_pos_sync (
  room_id text primary key,
  payload jsonb not null,
  updated_at timestamptz default now()
);

alter table public.twins_pos_sync enable row level security;

drop policy if exists "Acceso publico POS" on public.twins_pos_sync;
create policy "Acceso publico POS"
  on public.twins_pos_sync
  for all
  using (true)
  with check (true);`;

    const DEFAULT_STATE = {
      role: "seller",
      adminPassword: "twins2026",
      cloudPassword: "",
      cloudUnlocked: false,
      showAuthModal: false,
      showChangePassModal: false,
      authError: "",
      pendingTab: null,
      cashOpen: true,
      dayActive: true,
      dayStartedAt: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }),
      dayStartedLabel: new Date().toLocaleDateString("es-MX"),
      daySessions: [],
      selectedHistorySessionId: null,
      openingFund: 500,
      cashMovements: [],
      activeTab: "pos",
      selectedCategory: "Todos",
      searchQuery: "",
      showQuickMenuEditorOnHome: false,
      serviceType: "Comer aquí",
      orderName: "",
      paymentMethod: "Efectivo",
      amountPaid: "",
      orderNote: "",
      cart: [],
      lastTicket: null,
      lastKitchenTicket: null,
      inspectedOrderId: null,
      toastMsg: "",
      pendingPrintOrder: null,
      printStepCustomerDone: false,
      printStepKitchenDone: false,
      printerStatus: "Desconectada — Lista para vincular por Bluetooth",
      printerDeviceName: "",
      homeTitle: "SHOWROOM The Twins",
      homeSubtitle: "ESPACIO COLABORATIVO PARA EMPRENDEDORES",
      showHomeDesc: true,
      showHomeStock: true,
      optionModalProdId: null,
      optBurgerType: "Arrachera",
      optBurgerExtras: ["Con todo"],
      optWingFlavor: "BBQ",
      optMarquesita: "Queso",
      optJarritoFlavor: null,
      lastUpdatedTs: 0,
      products: [
        { id: "P1", kind: "standard", name: "Banderillas", category: "Antojitos", costPrice: 28, price: 65, stock: 30, infinite: false, desc: "Crujientes con aderezos" },
        { id: "P2", kind: "standard", name: "Orden de Papas", category: "Snacks", costPrice: 20, price: 50, stock: 40, infinite: false, desc: "Papas a la francesa doradas" },
        { id: "P3", kind: "ramen", name: "Ramen", category: "Especiales", costPrice: 38, price: 85, stock: 20, infinite: false, desc: "Precio ajustable al momento" },
        { id: "P4", name: "Marquesitas", kind: "marquesita", category: "Postres", costPrice: 12, price: 30, stock: 35, infinite: false, desc: "Elige: Queso, Nutella o Queso con nutella" },
        { id: "P5", name: "Hamburguesas", kind: "burger", category: "Platillos", costPrice: 45, price: 90, stock: 25, infinite: false, desc: "Arrachera o Sirloin • Con todo o sin ingredientes" },
        { id: "P6", name: "Orden de Alitas", kind: "wings", category: "Platillos", costPrice: 46, price: 90, stock: 25, infinite: false, desc: "Sabores: BBQ, Lemon Pepper, Cajun, Mango Habanero" },
        { id: "P7", name: "Coca", kind: "coca", category: "Refrescos", costPrice: 11, price: 25, stock: 24, infinite: false, desc: "Refresco de cola frío" },
        {
          id: "P8",
          name: "Jarrito",
          kind: "jarrito",
          category: "Refrescos",
          costPrice: 12,
          price: 25,
          stock: 0,
          infinite: false,
          desc: "Sabores disponibles por pieza",
          flavors: [
            { name: "Piña", stock: 8 },
            { name: "Mandarina", stock: 8 },
            { name: "Tamarindo", stock: 6 },
            { name: "Limón", stock: 6 },
            { name: "Uva", stock: 6 }
          ]
        },
        { id: "P9", name: "Extra Queso / Tocino", kind: "standard", category: "Extras", costPrice: 8, price: 20, stock: 0, infinite: true, desc: "Complemento adicional" },
        { id: "P10", name: "Aderezo Extra", kind: "standard", category: "Extras", costPrice: 6, price: 15, stock: 0, infinite: true, desc: "Aderezo extra a elegir" }
      ],
      orders: [],
      inventoryLogs: [
        {
          date: new Date().toLocaleDateString("es-MX"),
          time: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }),
          action: "Inicio",
          product: "Catálogo inicial",
          detail: "Menú y Aderezo Extra ($15) cargados",
          user: "Sistema"
        }
      ],
      liveLogs: [
        {
          time: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }),
          msg: "SHOWROOM The Twins POS Sincronizado listo"
        }
      ]
    };

    let cloudCfg = loadCloudCfg();
    let cloudStatus = cloudCfg.url && cloudCfg.key ? "Conectando a Supabase..." : "Solo local (Pega tu Publishable key en ☁️ Nube)";
    let isSyncing = false;
    let state = loadState();
    let btDevice = null;
    let btChar = null;
    let toastTimer = null;

    function loadCloudCfg() {
      try {
        const raw = localStorage.getItem(CLOUD_CFG_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed.url && parsed.key) return parsed;
        }
      } catch (e) {}
      return {
        url: PRESET_SUPABASE_URL,
        key: PRESET_SUPABASE_ANON_KEY
      };
    }

    function saveCloudCfg(url, key) {
      cloudCfg = {
        url: String(url || "").trim().replace(/\/+$/, ""),
        key: String(key || "").trim()
      };
      try {
        localStorage.setItem(CLOUD_CFG_KEY, JSON.stringify(cloudCfg));
      } catch (e) {}
    }

    function hasCloud() {
      return Boolean(cloudCfg && cloudCfg.url && cloudCfg.key);
    }

    function getSharedPayloadFromState() {
      return {
        lastUpdatedTs: state.lastUpdatedTs || Date.now(),
        adminPassword: state.adminPassword,
        cloudPassword: state.cloudPassword,
        homeTitle: state.homeTitle,
        homeSubtitle: state.homeSubtitle,
        showHomeDesc: state.showHomeDesc,
        showHomeStock: state.showHomeStock,
        products: state.products,
        orders: state.orders,
        daySessions: state.daySessions,
        dayActive: state.dayActive,
        dayStartedAt: state.dayStartedAt,
        dayStartedLabel: state.dayStartedLabel,
        cashMovements: state.cashMovements,
        inventoryLogs: state.inventoryLogs.slice(0, 120),
        liveLogs: state.liveLogs.slice(0, 60)
      };
    }

    function applySharedPayload(remote) {
      if (!remote || typeof remote !== "object") return;
      if (Array.isArray(remote.products)) state.products = remote.products;
      if (Array.isArray(remote.orders)) state.orders = remote.orders;
      if (Array.isArray(remote.daySessions)) state.daySessions = remote.daySessions;
      if (typeof remote.dayActive === "boolean") state.dayActive = remote.dayActive;
      if (remote.dayStartedAt) state.dayStartedAt = remote.dayStartedAt;
      if (remote.dayStartedLabel) state.dayStartedLabel = remote.dayStartedLabel;
      if (Array.isArray(remote.cashMovements)) state.cashMovements = remote.cashMovements;
      if (Array.isArray(remote.inventoryLogs)) state.inventoryLogs = remote.inventoryLogs;
      if (Array.isArray(remote.liveLogs)) state.liveLogs = remote.liveLogs;
      if (remote.adminPassword) state.adminPassword = remote.adminPassword;
      if (typeof remote.cloudPassword === "string") state.cloudPassword = remote.cloudPassword;
      if (remote.homeTitle) state.homeTitle = remote.homeTitle;
      if (remote.homeSubtitle) state.homeSubtitle = remote.homeSubtitle;
      if (typeof remote.showHomeDesc === "boolean") state.showHomeDesc = remote.showHomeDesc;
      if (typeof remote.showHomeStock === "boolean") state.showHomeStock = remote.showHomeStock;
      if (remote.lastUpdatedTs) state.lastUpdatedTs = remote.lastUpdatedTs;

      if (state.orders.length > 0) {
        if (!state.lastTicket) state.lastTicket = state.orders[0];
        const prevKitchen = state.lastKitchenTicket ? state.orders.find(o => o.id === state.lastKitchenTicket.id) : null;
        state.lastKitchenTicket = prevKitchen || state.orders[0];
      }
      saveLocalOnly();
    }

    async function pushToCloud() {
      if (!hasCloud()) return;
      state.lastUpdatedTs = Date.now();
      saveLocalOnly();
      try {
        const endpoint = `${cloudCfg.url}/rest/v1/twins_pos_sync?on_conflict=room_id`;
        const res = await fetch(endpoint, {
          method: "POST",
          headers: {
            "apikey": cloudCfg.key,
            "Authorization": "Bearer " + cloudCfg.key,
            "Content-Type": "application/json",
            "Prefer": "resolution=merge-duplicates,return=minimal"
          },
          body: JSON.stringify({
            room_id: SYNC_ROOM_ID,
            payload: getSharedPayloadFromState(),
            updated_at: new Date().toISOString()
          })
        });
        if (res.ok) {
          cloudStatus = "🟢 Sincronizado en vivo (" + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" }) + ")";
        } else {
          cloudStatus = "⚠️ Error HTTP " + res.status + " al subir (revisa tabla/RLS)";
        }
      } catch (err) {
        cloudStatus = "⚠️ Sin conexión a Supabase";
      }
      render();
    }

    async function pullFromCloud(forceApply) {
      if (!hasCloud() || isSyncing) return;
      isSyncing = true;
      try {
        const endpoint = `${cloudCfg.url}/rest/v1/twins_pos_sync?room_id=eq.${encodeURIComponent(SYNC_ROOM_ID)}&select=payload,updated_at`;
        const res = await fetch(endpoint, {
          headers: {
            "apikey": cloudCfg.key,
            "Authorization": "Bearer " + cloudCfg.key
          }
        });
        if (!res.ok) {
          cloudStatus = "⚠️ Error HTTP " + res.status + " al leer Supabase";
          isSyncing = false;
          render();
          return;
        }
        const rows = await res.json();
        if (Array.isArray(rows) && rows.length > 0 && rows[0].payload) {
          const remote = rows[0].payload;
          const remoteTs = Number(remote.lastUpdatedTs || 0);
          const localTs = Number(state.lastUpdatedTs || 0);
          if (forceApply || remoteTs > localTs) {
            const activeTag = document.activeElement ? document.activeElement.tagName : "";
            applySharedPayload(remote);
            cloudStatus = "🟢 Sincronizado (" + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" }) + ")";
            if (activeTag !== "INPUT" && activeTag !== "TEXTAREA" && activeTag !== "SELECT") {
              render();
            }
          } else {
            cloudStatus = "🟢 Al día (" + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" }) + ")";
          }
        } else {
          await pushToCloud();
        }
      } catch (err) {
        cloudStatus = "⚠️ Sin red / revisa URL de Supabase";
      }
      isSyncing = false;
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          return Object.assign({}, DEFAULT_STATE, parsed, {
            showAuthModal: false,
            showChangePassModal: false,
            cloudUnlocked: false,
            optionModalProdId: null,
            authError: "",
            pendingTab: null,
            toastMsg: "",
            cart: parsed.cart || [],
            cashMovements: parsed.cashMovements || [],
            daySessions: parsed.daySessions || [],
            dayActive: typeof parsed.dayActive === "boolean" ? parsed.dayActive : true,
            dayStartedAt: parsed.dayStartedAt || new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }),
            dayStartedLabel: parsed.dayStartedLabel || new Date().toLocaleDateString("es-MX"),
            selectedHistorySessionId: parsed.selectedHistorySessionId || null,
            inventoryLogs: parsed.inventoryLogs || DEFAULT_STATE.inventoryLogs,
            liveLogs: parsed.liveLogs || DEFAULT_STATE.liveLogs
          });
        }
      } catch (err) {}
      return JSON.parse(JSON.stringify(DEFAULT_STATE));
    }

    function saveLocalOnly() {
      try {
        const copy = Object.assign({}, state, {
          showAuthModal: false,
          showChangePassModal: false,
          cloudUnlocked: false,
          optionModalProdId: null,
          authError: "",
          pendingTab: null,
          toastMsg: ""
        });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(copy));
      } catch (err) {}
    }

    function saveState(syncRemote = true) {
      saveLocalOnly();
      if (syncRemote && hasCloud()) {
        pushToCloud();
      }
    }

    function showToast(msg) {
      state.toastMsg = msg;
      render();
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        state.toastMsg = "";
        render();
      }, 2600);
    }

    function fmt(n) {
      return "$" + Number(n || 0).toFixed(2);
    }

    function esc(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function getTotalStock(prod) {
      if (prod.kind === "jarrito" && Array.isArray(prod.flavors)) {
        return prod.flavors.reduce((s, f) => s + Number(f.stock || 0), 0);
      }
      return Number(prod.stock || 0);
    }

    function addLiveLog(msg) {
      const time = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
      state.liveLogs.unshift({ time, msg });
      if (state.liveLogs.length > 60) state.liveLogs.pop();
    }

    function addInvLog(action, product, detail) {
      const now = new Date();
      state.inventoryLogs.unshift({
        date: now.toLocaleDateString("es-MX"),
        time: now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" }),
        action,
        product,
        detail,
        user: state.role === "admin" ? "Administrador" : "Vendedor"
      });
      if (state.inventoryLogs.length > 150) state.inventoryLogs.pop();
    }

    const WEEKDAY_NAMES = ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];
    const JUE_DOM_DAYS = ["Jueves", "Viernes", "Sábado", "Domingo"];

    function getOrderDayName(order) {
      if (order && order.dayName) return order.dayName;
      return WEEKDAY_NAMES[new Date().getDay()];
    }

    function isInThuSunCycle(dayName) {
      return JUE_DOM_DAYS.includes(dayName);
    }

    function getAllHistoricalAndCurrentOrders() {
      const archivedOrders = [];
      (state.daySessions || []).forEach(sess => {
        (sess.orders || []).forEach(o => {
          archivedOrders.push(Object.assign({}, o, {
            dayName: o.dayName || sess.dayName || WEEKDAY_NAMES[new Date().getDay()],
            sessionDate: sess.dateLabel || o.date || ""
          }));
        });
      });
      return [...state.orders, ...archivedOrders];
    }

    function startNewDayAccount() {
      const now = new Date();
      const dayName = WEEKDAY_NAMES[now.getDay()];
      const dateLabel = now.toLocaleDateString("es-MX");
      const timeLabel = now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

      if (state.orders.length > 0 && !state.dayActive) {
        const salesSum = state.orders.filter(o => o.status !== "Cancelado").reduce((s, o) => s + Number(o.totalSale || 0), 0);
        state.daySessions.unshift({
          id: "DAY-" + Date.now(),
          dateLabel: state.dayStartedLabel || dateLabel,
          dayName: WEEKDAY_NAMES[now.getDay()],
          openedAt: state.dayStartedAt || timeLabel,
          closedAt: timeLabel,
          ordersCount: state.orders.length,
          totalSales: salesSum,
          orders: JSON.parse(JSON.stringify(state.orders))
        });
        if (state.daySessions.length > 60) state.daySessions.pop();
      }

      state.dayActive = true;
      state.cashOpen = true;
      state.dayStartedAt = timeLabel;
      state.dayStartedLabel = dateLabel;
      state.orders = [];
      state.lastTicket = null;
      state.lastKitchenTicket = null;
      state.inspectedOrderId = null;

      addLiveLog(`Cuenta del día iniciada (${dayName} ${dateLabel} a las ${timeLabel}) — Comandas en 0`);
      saveLocalOnly();
      render();
      showToast(`✓ Cuenta iniciada (${dayName})`);
      if (hasCloud()) {
        pushToCloud();
      }
    }

    function closeCurrentDaySession() {
      if (state.pendingPrintOrder) {
        showToast("Termina las 2 impresiones antes de cerrar el día.");
        return;
      }
      const now = new Date();
      const dayName = WEEKDAY_NAMES[now.getDay()];
      const dateLabel = state.dayStartedLabel || now.toLocaleDateString("es-MX");
      const closedAt = now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      const validOrders = state.orders.filter(o => o.status !== "Cancelado");
      const totalSales = validOrders.reduce((s, o) => s + Number(o.totalSale || 0), 0);

      const confirmMsg = `¿Cerrar y concluir el día (${dayName} ${dateLabel}) con ${state.orders.length} comanda(s) por ${fmt(totalSales)}? Las comandas quedarán guardadas en Días Anteriores y mañana/siguiente día iniciará limpio.`;
      if (!confirm(confirmMsg)) return;

      const newSession = {
        id: "DAY-" + Date.now(),
        dateLabel,
        dayName: state.orders[0] && state.orders[0].dayName ? state.orders[0].dayName : dayName,
        openedAt: state.dayStartedAt || closedAt,
        closedAt,
        ordersCount: state.orders.length,
        totalSales,
        orders: JSON.parse(JSON.stringify(state.orders))
      };

      state.daySessions.unshift(newSession);
      if (state.daySessions.length > 60) state.daySessions.pop();
      state.selectedHistorySessionId = newSession.id;

      state.orders = [];
      state.lastTicket = null;
      state.lastKitchenTicket = null;
      state.inspectedOrderId = null;
      state.dayActive = false;

      addLiveLog(`Día concluido (${newSession.dayName} ${dateLabel}) • ${newSession.ordersCount} comandas archivadas (${fmt(totalSales)})`);
      saveLocalOnly();
      render();
      showToast("✓ Día cerrado y comandas guardadas en Días Anteriores");
      if (hasCloud()) {
        pushToCloud();
      }
    }

    function reprintHistoricalOrder(sessionId, orderId) {
      const sess = (state.daySessions || []).find(s => s.id === sessionId);
      if (!sess) return;
      const ord = (sess.orders || []).find(o => Number(o.id) === Number(orderId));
      if (!ord) return;
      state.lastKitchenTicket = ord;
      state.lastTicket = ord;
      state.inspectedOrderId = ord.id;
      saveLocalOnly();
      render();
      if (btChar || btDevice) {
        printBT(ord, true);
      } else {
        printKitchen58System(ord);
      }
    }

    function renderPreviousDaysMonitoringCard() {
      const sessions = state.daySessions || [];
      if (sessions.length === 0) {
        return `
          <div class="bg-white p-5 rounded-2xl border space-y-2 text-xs">
            <h3 class="font-black text-[#081736] text-sm sm:text-base">📅 Comandas de Días Anteriores (Monitoreo)</h3>
            <p class="text-slate-400">Aún no hay días cerrados guardados. Cuando concluyas un día con <b>Cerrar Día</b>, aquí aparecerán sus comandas para monitoreo.</p>
          </div>
        `;
      }

      const activeSess = sessions.find(s => s.id === state.selectedHistorySessionId) || sessions[0];

      return `
        <div class="bg-white p-5 rounded-2xl border-2 border-[#081736] space-y-4 text-xs">
          <div class="flex flex-wrap justify-between items-center gap-2 border-b pb-3">
            <div>
              <div class="text-[10px] font-bold uppercase text-amber-600">Auditoría y Monitoreo</div>
              <h3 class="font-black text-[#081736] text-base">📅 Comandas de Días Anteriores</h3>
              <p class="text-slate-500 text-[11px]">Selecciona un día cerrado para revisar o reimprimir las comandas de ese día.</p>
            </div>
            <div class="flex flex-wrap gap-1.5">
              ${sessions.map(s => `
                <button type="button" data-sid="${esc(s.id)}" onclick="state.selectedHistorySessionId=this.dataset.sid;saveLocalOnly();render();"
                  class="px-3 py-1.5 rounded-xl font-bold text-[11px] border ${activeSess.id === s.id ? "bg-[#081736] text-amber-400 border-[#081736]" : "bg-slate-50 text-slate-700 hover:border-amber-400"}">
                  ${esc(s.dayName)} ${esc(s.dateLabel)} (${s.ordersCount} ord.)
                </button>
              `).join("")}
            </div>
          </div>

          <div class="bg-slate-50 p-3.5 rounded-xl border flex flex-wrap justify-between items-center gap-2">
            <div>
              <span class="font-black text-[#081736] text-sm">Jornada: ${esc(activeSess.dayName)} ${esc(activeSess.dateLabel)}</span>
              <span class="text-slate-500 ml-2">Inicio: <b>${esc(activeSess.openedAt)}</b> • Cierre: <b>${esc(activeSess.closedAt)}</b></span>
            </div>
            <div class="font-black text-emerald-700 text-sm">
              Total del día: ${fmt(activeSess.totalSales)} (${activeSess.ordersCount} comandas)
            </div>
          </div>

          ${(!activeSess.orders || activeSess.orders.length === 0)
            ? `<p class="text-slate-400 py-3">No hubo comandas registradas en este día.</p>`
            : `<div class="space-y-2">
                ${activeSess.orders.map(o => `
                  <div class="p-3 rounded-xl border bg-white flex flex-wrap justify-between items-start gap-2">
                    <div class="space-y-1">
                      <div class="flex flex-wrap items-center gap-2">
                        <span class="font-black text-[#081736]">${esc(o.orderName)}</span>
                        <span class="text-slate-400">#${o.id} • ${esc(o.time)} • ${esc(o.serviceType)}</span>

    function getCycleStats() {
      const valid = getAllHistoricalAndCurrentOrders().filter(o => o.status !== "Cancelado");
      const byDay = {};
      ["Jueves", "Viernes", "Sábado", "Domingo", "Lunes", "Martes", "Miércoles"].forEach(d => {
        byDay[d] = { day: d, ordersCount: 0, sales: 0, cost: 0, profit: 0, deliveredCount: 0 };
      });

      valid.forEach(o => {
        const d = getOrderDayName(o);
        if (!byDay[d]) byDay[d] = { day: d, ordersCount: 0, sales: 0, cost: 0, profit: 0, deliveredCount: 0 };
        byDay[d].ordersCount += 1;
        byDay[d].sales += Number(o.totalSale || 0);
        byDay[d].cost += Number(o.totalCost || 0);
        byDay[d].profit += Number(o.profit != null ? o.profit : ((o.totalSale || 0) - (o.totalCost || 0)));
        if (o.status === "Entregado") byDay[d].deliveredCount += 1;
      });

      const cycleOrders = valid.filter(o => isInThuSunCycle(getOrderDayName(o)));
      const cycleSales = cycleOrders.reduce((s, o) => s + Number(o.totalSale || 0), 0);
      const cycleCost = cycleOrders.reduce((s, o) => s + Number(o.totalCost || 0), 0);
      const cycleGrossProfit = cycleSales - cycleCost;

      const cyclePayroll = state.cashMovements
        .filter(m => m.category === "Sueldos / Nómina" && isInThuSunCycle(m.dayName || WEEKDAY_NAMES[new Date().getDay()]))
        .reduce((s, m) => s + Number(m.amount || 0), 0);

      const cycleOtherExpenses = state.cashMovements
        .filter(m => (m.category === "Gasto Operativo / Insumos" || m.category === "Servicios / Renta") && isInThuSunCycle(m.dayName || WEEKDAY_NAMES[new Date().getDay()]))
        .reduce((s, m) => s + Number(m.amount || 0), 0);

      const cycleNetAfterPay = cycleGrossProfit - cyclePayroll - cycleOtherExpenses;

      return {
        byDay,
        cycleOrdersCount: cycleOrders.length,
        cycleSales,
        cycleCost,
        cycleGrossProfit,
        cyclePayroll,
        cycleOtherExpenses,
        cycleNetAfterPay
      };
    }

    function getProductSalesRanking() {
      const valid = getAllHistoricalAndCurrentOrders().filter(o => o.status !== "Cancelado");
      const map = new Map();

      state.products.forEach(p => {
        map.set(p.baseName || p.name, {
          name: p.name,
          category: p.category || "General",
          unitsSold: 0,
          revenue: 0,
          cost: 0,
          profit: 0
        });
      });

      valid.forEach(o => {
        (o.items || []).forEach(it => {
          const key = it.baseName || it.displayName;
          const qty = Number(it.qty || 0);
          const price = Number(it.price || 0);
          const cost = Number(it.costPrice || 0);
          const lineRev = price * qty;
          const lineCost = cost * qty;

          if (!map.has(key)) {
            map.set(key, {
              name: key,
              category: "Menú",
              unitsSold: 0,
              revenue: 0,
              cost: 0,
              profit: 0
            });
          }
          const entry = map.get(key);
          entry.unitsSold += qty;
          entry.revenue += lineRev;
          entry.cost += lineCost;
          entry.profit += (lineRev - lineCost);
        });
      });

      const all = Array.from(map.values());
      const mostSold = [...all].sort((a, b) => (b.unitsSold - a.unitsSold) || (b.revenue - a.revenue));
      const leastSold = [...all].sort((a, b) => (a.unitsSold - b.unitsSold) || (a.revenue - b.revenue));

      return {
        all,
        mostSold,
        leastSold
      };
    }

    function getFinancials() {
      const valid = getAllHistoricalAndCurrentOrders().filter(o => o.status !== "Cancelado");
      const sales = valid.reduce((s, o) => s + o.totalSale, 0);
      const cost = valid.reduce((s, o) => s + o.totalCost, 0);
      const grossProfit = sales - cost;
      const payroll = state.cashMovements
        .filter(m => m.category === "Sueldos / Nómina")
        .reduce((s, m) => s + m.amount, 0);
      const expenses = state.cashMovements
        .filter(m => m.category === "Gasto Operativo / Insumos" || m.category === "Servicios / Renta")
        .reduce((s, m) => s + m.amount, 0);
      const extraIn = state.cashMovements
        .filter(m => m.category === "Ingreso Adicional")
        .reduce((s, m) => s + m.amount, 0);
      const netFinal = grossProfit + extraIn - payroll - expenses;
      return {
        count: valid.length,
        sales,
        cost,
        grossProfit,
        payroll,
        expenses,
        extraIn,
        netFinal
      };
    }

    function getCartReservedQty(prodId, flavorName) {
      return state.cart
        .filter(it => it.prodId === prodId && (!flavorName || it.flavorName === flavorName))
        .reduce((s, it) => s + it.qty, 0);
    }

    function addCartItemDirect(p, displayName, detail, flavorName) {
      if (p.kind === "jarrito" && flavorName) {
        const fl = (p.flavors || []).find(f => f.name === flavorName);
        if (!fl) return;
        const reserved = getCartReservedQty(p.id, flavorName);
        if (reserved + 1 > fl.stock) {
          alert(`Solo quedan ${fl.stock} Jarritos de ${flavorName}.`);
          return;
        }
      } else if (!p.infinite) {
        const reserved = getCartReservedQty(p.id, null);
        if (reserved + 1 > p.stock) {
          alert("No hay más stock disponible de " + p.name);
          return;
        }
      }

      const found = state.cart.find(x => x.prodId === p.id && x.displayName === displayName && x.detail === detail && p.kind !== "ramen");
      if (found) {
        found.qty += 1;
      } else {
        state.cart.push({
          prodId: p.id,
          kind: p.kind || "standard",
          baseName: p.name,
          displayName: displayName,
          detail: detail || "",
          flavorName: flavorName || null,
          costPrice: Number(p.costPrice),
          price: Number(p.price),
          qty: 1
        });
      }
      saveState(false);
      render();
    }

    function updateCartRamenPrice(idx, newPrice) {
      const it = state.cart[idx];
      if (!it) return;
      it.price = Math.max(0, parseFloat(newPrice) || 0);
      saveState(false);
      render();
    }

    function changeQty(idx, delta) {
      const it = state.cart[idx];
      if (!it) return;
      const p = state.products.find(x => x.id === it.prodId);
      const next = it.qty + delta;
      if (next <= 0) {
        state.cart.splice(idx, 1);
      } else {
        if (p && p.kind === "jarrito" && it.flavorName) {
          const fl = (p.flavors || []).find(f => f.name === it.flavorName);
          if (fl && next > fl.stock) {
            alert(`Solo hay ${fl.stock} disponibles de ${it.flavorName}.`);
            return;
          }
        } else if (p && !p.infinite && next > p.stock) {
          alert("Stock máximo alcanzado.");
          return;
        }
        it.qty = next;
      }
      saveState(false);
      render();
    }

    async function checkoutOrder() {
      if (state.pendingPrintOrder) {
        showToast("Termina las 2 impresiones de la orden actual primero.");
        return;
      }
      if (!state.cashOpen) {
        alert("La caja está cerrada.");
        return;
      }
      if (state.cart.length === 0) return;

      if (hasCloud()) {
        await pullFromCloud(false);
      }

      const maxFolio = state.orders.reduce((mx, o) => Math.max(mx, Number(o.id) || 1000), 1000);
      const folio = maxFolio + 1;
      const cleanOrderName = (state.orderName || "").trim() || ("Orden #" + folio);
      const totalSale = state.cart.reduce((s, i) => s + i.price * i.qty, 0);
      const totalCost = state.cart.reduce((s, i) => s + i.costPrice * i.qty, 0);
      const paid = state.paymentMethod === "Efectivo" ? (parseFloat(state.amountPaid) || totalSale) : totalSale;
      if (state.paymentMethod === "Efectivo" && paid < totalSale) {
        alert("El monto recibido es menor al total.");
        return;
      }
      const change = state.paymentMethod === "Efectivo" ? Math.max(0, paid - totalSale) : 0;
      const profit = totalSale - totalCost;

      state.cart.forEach(item => {
        const p = state.products.find(x => x.id === item.prodId);
        if (!p) return;
        if (p.kind === "jarrito" && item.flavorName) {
          const fl = (p.flavors || []).find(f => f.name === item.flavorName);
          if (fl) {
            const prev = fl.stock;
            fl.stock = Math.max(0, fl.stock - item.qty);
            addInvLog("Salida Jarrito", `Jarrito ${fl.name}`, `${cleanOrderName} (#${folio}): -${item.qty} (${prev} -> ${fl.stock})`);
          }
        } else if (!p.infinite) {
          const prev = p.stock;
          p.stock = Math.max(0, p.stock - item.qty);
          addInvLog("Salida por Venta", p.name, `${cleanOrderName} (#${folio}): -${item.qty} (${prev} -> ${p.stock})`);
        }
      });

      const nowOrder = new Date();
      const order = {
        id: folio,
        orderName: cleanOrderName,
        dayName: WEEKDAY_NAMES[nowOrder.getDay()],
        date: nowOrder.toLocaleDateString("es-MX"),
        time: nowOrder.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }),
        deliveredAt: null,
        items: JSON.parse(JSON.stringify(state.cart)),
        serviceType: state.serviceType,
        paymentMethod: state.paymentMethod,
        totalSale,
        totalCost,
        profit,
        paid,
        change,
        note: state.orderNote,
        status: "En cocina"
      };

      state.orders.unshift(order);
      state.lastTicket = order;
      state.lastKitchenTicket = order;
      state.inspectedOrderId = order.id;
      state.cart = [];
      state.orderName = "";
      state.amountPaid = "";
      state.orderNote = "";

      state.pendingPrintOrder = null;
      state.printStepCustomerDone = false;
      state.printStepKitchenDone = false;

      addLiveLog(`${cleanOrderName} (#${folio}) cobrada por ${fmt(totalSale)}`);
      saveState(true);
      render();
    }

    function escPosInitAndAlign(alignCenter) {
      return new Uint8Array([0x1B, 0x40, 0x1B, 0x61, alignCenter ? 0x01 : 0x00]);
    }

    function escPosBold(on) {
      return new Uint8Array([0x1B, 0x45, on ? 0x01 : 0x00]);
    }

    function escPosFeedAndCut() {
      return new Uint8Array([0x0A, 0x0A, 0x0A, 0x0A, 0x1D, 0x56, 0x42, 0x00]);
    }

    async function resolveWritableCharacteristic(device) {
      const server = await device.gatt.connect();
      const commonServices = [
        "000018f0-0000-1000-8000-00805f9b34fb",
        "49535343-fe7d-4ae5-8fa9-9fafd205e455",
        "0000ffe0-0000-1000-8000-00805f9b34fb",
        "0000ff00-0000-1000-8000-00805f9b34fb",
        "e7810a71-73ae-499d-8c15-faa9aef0c3f2"
      ];
      let services = [];
      try {
        services = await server.getPrimaryServices();
      } catch (e) {
        for (const uuid of commonServices) {
          try {
            const s = await server.getPrimaryService(uuid);
            if (s) services.push(s);
          } catch (_) {}
        }
      }
      for (const s of services) {
        try {
          const chars = await s.getCharacteristics();
          for (const c of chars) {
            if (c.properties.write || c.properties.writeWithoutResponse) {
              return c;
            }
          }
        } catch (_) {}
      }
      return null;
    }

    async function connectBT() {
      if (!navigator.bluetooth) {
        alert("Este navegador no soporta Web Bluetooth directo. Usa Chrome o Edge en Android/Windows, o usa el botón RawBT en Android.");
        return false;
      }
      try {
        state.printerStatus = "Buscando impresora Bluetooth...";
        render();
        const device = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: [
            "000018f0-0000-1000-8000-00805f9b34fb",
            "49535343-fe7d-4ae5-8fa9-9fafd205e455",
            "0000ffe0-0000-1000-8000-00805f9b34fb",
            "0000ff00-0000-1000-8000-00805f9b34fb",
            "e7810a71-73ae-499d-8c15-faa9aef0c3f2"
          ]
        });
        btDevice = device;
        device.addEventListener("gattserverdisconnected", function() {
          btChar = null;
          state.printerStatus = `Desconectada (${state.printerDeviceName || "Bluetooth"}) — Toca Reconectar`;
          render();
        });
        const char = await resolveWritableCharacteristic(device);
        if (!char) {
          state.printerStatus = "Vinculada pero sin canal de escritura BLE — Usa RawBT o 58mm";
          alert("La impresora se emparejó pero su perfil Bluetooth es Classic/SPP. En Android usa RawBT o en PC/Tablet usa 58mm.");
          render();
          return false;
        }
        btChar = char;
        state.printerDeviceName = device.name || "Impresora 58mm";
        state.printerStatus = `Conectada: ${state.printerDeviceName}`;
        saveState(false);
        render();
        return true;
      } catch (err) {
        state.printerStatus = "No conectada — Revisa Bluetooth encendido o usa RawBT / 58mm";
        render();
        return false;
      }
    }

    function buildEscPosPayload(plainText) {
      const encoder = new TextEncoder();
      const head = escPosInitAndAlign(false);
      const boldOn = escPosBold(true);
      const boldOff = escPosBold(false);
      const bodyBytes = encoder.encode(plainText);
      const tail = escPosFeedAndCut();

      const totalLen = head.length + boldOn.length + bodyBytes.length + boldOff.length + tail.length;
      const out = new Uint8Array(totalLen);
      let offset = 0;
      out.set(head, offset); offset += head.length;
      out.set(boldOn, offset); offset += boldOn.length;
      out.set(bodyBytes, offset); offset += bodyBytes.length;
      out.set(boldOff, offset); offset += boldOff.length;
      out.set(tail, offset);
      return out;
    }

    function writeChunkSafe(ch, chunk) {
      if (ch.properties.writeWithoutResponse && typeof ch.writeValueWithoutResponse === "function") {
        return ch.writeValueWithoutResponse(chunk);
      }
      return ch.writeValue(chunk);
    }

    async function sendTextBT(txt, label, silentOnAuto) {
      try {
        if (!btChar && btDevice) {
          btChar = await resolveWritableCharacteristic(btDevice);
        }
        if (!btChar) {
          if (silentOnAuto) return false;
          const ok = await connectBT();
          if (!ok || !btChar) return false;
        }
        const payload = buildEscPosPayload(txt);
        const chunkSize = 120;
        for (let i = 0; i < payload.length; i += chunkSize) {
          const slice = payload.slice(i, i + chunkSize);
          await writeChunkSafe(btChar, slice);
          await new Promise(r => setTimeout(r, 25));
        }
        render();
        return true;
      } catch (err) {
        btChar = null;
        state.printerStatus = "Error al enviar por BT — Reconecta o usa RawBT / 58mm";
        render();
        if (!silentOnAuto) {
          alert("No se pudo enviar por Bluetooth directo. Si usas Android, prueba RawBT; si usas PC/Tablet, usa 58mm.");
        }
        return false;
      }
    }

    function editProd(id, field, val) {
      const p = state.products.find(x => x.id === id);
      if (!p) return;
      if (field === "name") {
        const clean = String(val).trim();
        if (!clean || clean === p.name) return;
        const old = p.name;
        p.name = clean;
        addInvLog("Cambio de Nombre", clean, `"${old}" -> "${clean}"`);
      } else if (field === "category") {
        p.category = String(val).trim() || p.category;
        addInvLog("Cambio de Categoría", p.name, `Categoría: ${p.category}`);
      } else if (field === "costPrice") {
        const oldC = p.costPrice;
        p.costPrice = Math.max(0, parseFloat(val) || 0);
        addInvLog("Cambio de Costo", p.name, `${fmt(oldC)} -> ${fmt(p.costPrice)}`);
      } else if (field === "price") {
        const oldP = p.price;
        p.price = Math.max(0, parseFloat(val) || 0);
        addInvLog("Cambio de Precio", p.name, `${fmt(oldP)} -> ${fmt(p.price)}`);
      } else if (field === "stock") {
        const oldS = p.stock;
        p.stock = Math.max(0, parseInt(val) || 0);
        addInvLog("Ajuste de Stock", p.name, `${oldS} -> ${p.stock} uds`);
      } else if (field === "infinite") {
        p.infinite = Boolean(val);
        addInvLog("Stock Infinito", p.name, p.infinite ? "Activado (∞)" : "Desactivado");
      }
      saveState(true);
      render();
    }

                    <div class="font-black text-purple-950">Pago Rápido de Sueldos del Domingo (al Corte)</div>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                      <input name="pConcept" placeholder="Ej. Sueldos Domingo (cocina/barra)" class="sm:col-span-2 border rounded-lg px-2.5 py-1.5 bg-white font-semibold" />
                      <div class="flex gap-1.5">
                        <input name="pAmount" type="number" step="0.01" required placeholder="Monto $" class="w-full border rounded-lg px-2 py-1.5 bg-white font-bold" />
                        <button type="submit" class="bg-purple-800 hover:bg-purple-900 text-white font-black px-3 rounded-lg">Pagar</button>
                      </div>
                    </div>
                  </form>
                </div>

                <div class="lg:col-span-6 bg-white p-4 rounded-2xl border space-y-3 text-xs">
                  <h3 class="font-black text-[#081736] text-base">Registrar Gastos y Sueldos</h3>
                  <form onsubmit="createMovement(event)" class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                    <select name="mCat" class="border rounded-lg px-2 py-2 font-bold">
                      <option>Sueldos / Nómina</option>
                      <option>Gasto Operativo / Insumos</option>
                      <option>Servicios / Renta</option>
                      <option>Ingreso Adicional</option>
                    </select>
                    <input name="mConcept" required placeholder="Concepto / Empleado" class="border rounded-lg px-2.5 py-2" />
                    <div class="flex gap-1.5">
                      <input name="mAmount" type="number" step="0.01" required placeholder="$" class="w-full border rounded-lg px-2 py-2" />
                      <button type="submit" class="bg-[#081736] text-amber-400 font-black px-3 rounded-lg">+</button>
                    </div>
                    <label class="sm:col-span-3 flex items-center gap-1.5"><input name="mDrawer" type="checkbox" checked /> Afecta caja física</label>
                  </form>
                  <div class="divide-y max-h-56 overflow-y-auto">
                    ${state.cashMovements.map(m => `
                      <div class="py-2 flex justify-between items-center">
                        <span><b>${esc(m.category)}</b> (${esc(m.dayName || "")}): ${esc(m.concept)}</span>
                        <span class="font-bold">${fmt(m.amount)}</span>
                      </div>
                    `).join("")}
                  </div>
                </div>
              </div>
            </div>
            ${renderSalesByDayAndProductsCard()}
            `;
          })() : ""}

          ${state.activeTab === "printer" ? `
            <div class="bg-white p-5 rounded-2xl border max-w-2xl mx-auto space-y-4 text-xs">
              <div class="flex flex-wrap justify-between items-center gap-2">
                <div>
                  <h2 class="font-black text-[#081736] text-base">Impresora Bluetooth 58mm (Comanda y Ticket)</h2>
                  <div class="text-slate-500">Estado: <b>${esc(state.printerStatus)}</b></div>
                </div>
                <button onclick="connectBT()" class="bg-blue-600 text-white font-bold px-4 py-2 rounded-xl">🔗 Vincular Impresora BT</button>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 font-bold">
                <button onclick="printBT(getSample(), true)" class="bg-emerald-600 text-white py-2.5 rounded-xl">🔵 Enviar Comanda Cocina por BT</button>
                <button onclick="printBT(getSample(), false)" class="bg-blue-600 text-white py-2.5 rounded-xl">🔵 Enviar Ticket Cliente por BT</button>
                <button onclick="printRaw(getSample(), true)" class="bg-amber-400 text-[#081736] py-2.5 rounded-xl">RawBT Cocina (Android)</button>
                <button onclick="printCustomer58System(getSample())" class="bg-[#081736] text-white py-2.5 rounded-xl">Imprimir Prueba 58mm</button>
              </div>
            </div>
          ` : ""}
        </main>
      `;
    }

    render();

    if (hasCloud()) {
      pullFromCloud(true);
    }
    setInterval(() => {
      if (hasCloud()) {
        pullFromCloud(false);
      }
    }, 3500);
  </script>
</body>
</html>
